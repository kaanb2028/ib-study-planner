<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take Quiz — IB Study Planner</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.back{color:var(--accent);text-decoration:none;font-weight:700}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:white}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:700}.q{font-size:19px;font-weight:750;margin-bottom:14px}.choice{display:block;width:100%;text-align:left;margin:8px 0}.choice.correct{background:#ecfdf3;border-color:#12b76a}.choice.wrong{background:#fef3f2;border-color:#f04438}.meta{font-size:13px;color:var(--muted)}.feedback{margin-top:14px;padding:12px;border-radius:10px;background:#f8fafc}.score{font-size:28px;font-weight:800}.hidden{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Take Quiz</h1><div class="meta">Extra practice from your current IB topics.</div></div><a class="back" href="./">← Planner</a></div><div class="card controls"><select id="subject"><option value="mixed">Mixed subjects</option><option value="math">Math HL — Algebra</option><option value="physics">Physics HL — Kinematics</option><option value="econ">Economics HL — Price Mechanism</option><option value="business">Business SL — Vision, Mission, Strategy & Tactics</option></select><select id="count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option></select><button class="primary" id="start">Start Quiz</button></div><div id="quiz" class="hidden"><div class="card"><div class="meta" id="progress"></div><div class="q" id="question"></div><div id="choices"></div><div id="feedback" class="feedback hidden"></div><button class="primary hidden" id="next" style="margin-top:14px">Next question →</button></div></div><div id="result" class="card hidden"></div></div><script>
const bank=[
{s:'econ',q:'What is demand?',a:['The quantity consumers are willing and able to buy at different prices','The total stock firms have','The quantity firms must sell','The price set by government'],c:0,e:'Demand combines willingness and ability to buy at different prices.'},
{s:'econ',q:'What is supply?',a:['The quantity producers are willing and able to sell at different prices','Consumer desire only','A maximum legal price','Total market revenue'],c:0,e:'Supply is the quantity producers are willing and able to offer at different prices.'},
{s:'econ',q:'Ceteris paribus means…',a:['Other things being equal','Prices always rise','Demand equals supply','Government intervention'],c:0,e:'It means other relevant factors are held constant.'},
{s:'econ',q:'A movement along the demand curve is caused by…',a:['A change in the good’s own price','A change in income','A change in tastes','A change in population'],c:0,e:'Own-price changes cause movements along the curve; other determinants shift it.'},
{s:'econ',q:'If demand increases while supply is unchanged, equilibrium price will generally…',a:['Rise','Fall','Stay fixed by definition','Become zero'],c:0,e:'Higher demand creates upward pressure on equilibrium price and quantity.'},
{s:'econ',q:'A shortage exists when…',a:['Quantity demanded exceeds quantity supplied','Quantity supplied exceeds quantity demanded','Demand equals supply','Price is zero'],c:0,e:'A shortage is excess demand at the current price.'},
{s:'econ',q:'A surplus exists when…',a:['Quantity supplied exceeds quantity demanded','Quantity demanded exceeds quantity supplied','There is no market','Price equals marginal cost'],c:0,e:'A surplus is excess supply at the current price.'},
{s:'econ',q:'The price mechanism mainly uses changes in price to…',a:['Signal and allocate scarce resources','Eliminate scarcity','Guarantee equal incomes','Fix all externalities'],c:0,e:'Prices provide signals and incentives that help allocate resources.'},
{s:'math',q:'Solve: 3x + 5 = 20',a:['x = 5','x = 15','x = 25/3','x = 3'],c:0,e:'Subtract 5, then divide by 3: x = 5.'},
{s:'math',q:'Factorise x² − 9.',a:['(x−3)(x+3)','(x−9)(x+1)','(x−3)²','(x−9)(x+9)'],c:0,e:'This is a difference of two squares.'},
{s:'math',q:'If f(x)=2x²−3, what is f(2)?',a:['5','1','8','13'],c:0,e:'2(2²)−3 = 8−3 = 5.'},
{s:'math',q:'Simplify a³ × a⁴.',a:['a⁷','a¹²','2a⁷','a'],c:0,e:'When multiplying equal bases, add the exponents.'},
{s:'math',q:'What are the roots of x²−5x+6=0?',a:['2 and 3','−2 and −3','1 and 6','−1 and −6'],c:0,e:'x²−5x+6=(x−2)(x−3).'},
{s:'math',q:'Simplify (x²)³.',a:['x⁶','x⁵','x⁸','3x²'],c:0,e:'For a power of a power, multiply exponents: 2×3=6.'},
{s:'physics',q:'Velocity differs from speed because velocity…',a:['Includes direction','Is always larger','Cannot be zero','Has no units'],c:0,e:'Velocity is a vector; speed is a scalar.'},
{s:'physics',q:'Acceleration is defined as…',a:['Change in velocity divided by time','Distance divided by time','Velocity multiplied by time','Change in distance only'],c:0,e:'a = Δv/Δt.'},
{s:'physics',q:'The SI unit of acceleration is…',a:['m s⁻²','m s⁻¹','N','kg m s⁻¹'],c:0,e:'Acceleration is change in velocity per unit time.'},
{s:'physics',q:'For constant acceleration, which equation is correct?',a:['v = u + at','v = u/t + a','s = uv + at','a = vt'],c:0,e:'v = u + at is a standard constant-acceleration equation.'},
{s:'physics',q:'The gradient of a displacement–time graph gives…',a:['Velocity','Acceleration','Force','Momentum'],c:0,e:'Gradient = change in displacement / change in time = velocity.'},
{s:'physics',q:'The area under a velocity–time graph gives…',a:['Displacement','Acceleration','Jerk','Force'],c:0,e:'Integrating velocity over time gives displacement.'},
{s:'business',q:'A mission statement primarily describes…',a:['The organisation’s present purpose and what it does','A detailed daily timetable','Only its future share price','A legal requirement for all firms'],c:0,e:'Mission focuses on present purpose, activities and stakeholders.'},
{s:'business',q:'A vision statement mainly communicates…',a:['The desired future direction of the organisation','Today’s operating procedure','A single employee task','Current inventory'],c:0,e:'Vision describes the organisation’s aspirational future.'},
{s:'business',q:'Strategy is best described as…',a:['A longer-term plan for achieving objectives','A single short-term action','A mission statement','An accounting record'],c:0,e:'Strategy concerns the broader, longer-term route to objectives.'},
{s:'business',q:'Tactics are…',a:['Specific shorter-term actions used to implement strategy','The same as vision','Always five-year plans','Only financial objectives'],c:0,e:'Tactics are concrete actions supporting the broader strategy.'},
{s:'business',q:'Which pair is most accurate?',a:['Strategy = long-term direction; tactics = short-term actions','Strategy = daily task; tactics = corporate purpose','Vision = current purpose; mission = future dream','Mission = tactic; vision = budget'],c:0,e:'Strategy sets direction; tactics are the specific actions used to execute it.'}
];
let qs=[],i=0,score=0,locked=false;function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}function start(){let s=document.getElementById('subject').value,n=+document.getElementById('count').value,pool=s==='mixed'?bank:bank.filter(x=>x.s===s);qs=shuffle(pool);while(qs.length<n)qs=qs.concat(shuffle(pool));qs=qs.slice(0,n);i=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show()}function show(){locked=false;let x=qs[i];document.getElementById('progress').textContent=`Question ${i+1} of ${qs.length} · Score ${score}`;document.getElementById('question').textContent=x.q;let order=shuffle(x.a.map((v,j)=>({v,j})));document.getElementById('choices').innerHTML=order.map(o=>`<button class="choice" data-j="${o.j}">${o.v}</button>`).join('');document.getElementById('feedback').classList.add('hidden');document.getElementById('next').classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,+b.dataset.j))}function answer(btn,j){if(locked)return;locked=true;let x=qs[i],ok=j===x.c;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.j===x.c)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');let f=document.getElementById('feedback');f.innerHTML=`<b>${ok?'Correct ✓':'Not quite'}</b><br>${x.e}`;f.classList.remove('hidden');document.getElementById('next').classList.remove('hidden')}function next(){i++;if(i<qs.length)show();else finish()}function finish(){document.getElementById('quiz').classList.add('hidden');let pct=Math.round(score/qs.length*100),r=document.getElementById('result');r.innerHTML=`<div class="score">${score}/${qs.length} · ${pct}%</div><p>${pct>=80?'Strong. Review any mistakes once and move on.':pct>=60?'Good start. Redo the questions you missed.':'Review the topic, then take another short quiz.'}</p><button class="primary" onclick="start()">Take another quiz</button>`;r.classList.remove('hidden')}document.getElementById('start').onclick=start;document.getElementById('next').onclick=next;
</script></body></html>
