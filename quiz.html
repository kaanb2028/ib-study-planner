<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Challenge Quiz</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e5e7eb;--accent:#4f46e5;--good:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:var(--accent);font-weight:800;text-decoration:none}.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.subject,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.subject{padding:20px;text-align:left;cursor:pointer;min-height:135px}.subject strong{display:block;font-size:18px;margin-bottom:8px}.meta{font-size:12px;color:var(--muted)}.card{padding:22px;margin-top:16px}.qnum{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase}.progress{height:8px;background:#eceef3;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress div{height:100%;background:var(--accent)}.question{font-size:20px;font-weight:720;line-height:1.55;white-space:pre-line}.visual{margin:16px 0;padding:12px;background:#fafafa;border:1px solid var(--line);border-radius:14px;text-align:center}.visual svg{max-width:100%;height:auto}.options{display:grid;gap:9px;margin-top:18px}.option{padding:13px;border:1px solid var(--line);border-radius:11px;background:white;text-align:left;cursor:pointer}.option.selected{border-color:var(--accent);background:#eef2ff}.textanswer{width:100%;margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{padding:10px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.feedback{padding:15px;border-radius:11px;margin-top:16px;line-height:1.55}.correct{background:#ecfdf3;color:#05603a}.wrong{background:#fef3f2;color:#912018}.hidden{display:none!important}.result{text-align:center}.score{font-size:58px;font-weight:900}@media(max-width:800px){.subjects{grid-template-columns:1fr 1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Take Quiz</h1><div class="meta">IB Challenge Mode • 20 questions • multi-step reasoning • graphs • application</div></div><a class="back" href="./">← Planner</a></div><section id="home"><div class="subjects"><button class="subject" onclick="start('math')"><strong>📐 Math AA HL</strong><span class="meta">Algebra & functions • IB HL challenge</span></button><button class="subject" onclick="start('physics')"><strong>⚛️ Physics HL</strong><span class="meta">Kinematics • multi-step modelling</span></button><button class="subject" onclick="start('econ')"><strong>📈 Economics HL</strong><span class="meta">Price mechanism • diagram analysis</span></button><button class="subject" onclick="start('business')"><strong>💼 Business SL</strong><span class="meta">Vision • mission • strategy • tactics</span></button></div><div class="card"><b>No definition drill.</b> These questions are designed to require several steps, interpretation, transfer and application. The numbers/scenarios change between attempts.</div></section><section id="quiz" class="hidden"></section></div><script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)],shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const mc=(q,a,w,e,v='')=>({type:'mc',q,options:shuffle([a,...w]),answer:a,explain:e,visual:v});const sh=(q,a,e,v='')=>({type:'short',q,answers:a.map(String),explain:e,visual:v});
function econGraph(mode){let extra=mode==='D+'?'<path d="M95 35 L285 175" stroke="#7c3aed" stroke-width="3" fill="none"/><text x="270" y="170">D1</text>':mode==='S-'?'<path d="M25 175 L215 35" stroke="#7c3aed" stroke-width="3" fill="none"/><text x="27" y="168">S1</text>':'';return `<div class="visual"><svg viewBox="0 0 340 225" width="470"><line x1="42" y1="190" x2="310" y2="190" stroke="#111"/><line x1="42" y1="190" x2="42" y2="20" stroke="#111"/><path d="M55 35 L245 175" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M55 175 L245 35" stroke="#dc2626" stroke-width="3" fill="none"/>${extra}<text x="245" y="178">D0</text><text x="245" y="40">S0</text><text x="300" y="213">Q</text><text x="15" y="25">P</text></svg></div>`}
function vt(){return `<div class="visual"><svg viewBox="0 0 360 220" width="480"><line x1="40" y1="180" x2="325" y2="180" stroke="#111"/><line x1="40" y1="180" x2="40" y2="20" stroke="#111"/><polyline points="40,180 120,60 210,60 300,145" fill="none" stroke="#2563eb" stroke-width="4"/><text x="110" y="198">4</text><text x="200" y="198">10</text><text x="292" y="198">16</text><text x="18" y="65">12</text><text x="330" y="198">t/s</text><text x="7" y="25">v/(m s⁻¹)</text></svg></div>`}
function math(){let bank=[];let p=R(2,5),q=R(1,4),r=R(2,6);bank.push(sh(`The quadratic f(x)=x²−${2*p}x+${p*p-q}. The line y=k is tangent to the graph at its minimum point. Find k.`,[p*p-q-p*p,-q],`Complete the square: f(x)=(x−${p})²−${q}. The minimum value is −${q}, hence k=−${q}.`));bank.push(sh(`Let f(x)=(2x−${p})/(x+${q}). Find the exact value of x for which f(x)=3.`,[(p+3*q)/-1],`2x−${p}=3(x+${q}) ⇒ 2x−${p}=3x+${3*q} ⇒ x=−${p+3*q}.`));bank.push(mc(`A polynomial P(x)=x³+ax²+bx−${r*2} has x−2 as a factor and leaves remainder ${r} when divided by x+1. Which pair of equations must a and b satisfy?`,`2a+b=${r-4} and a−b=${3*r-1}`,[`2a+b=${r+4} and a+b=${3*r-1}`,`a+2b=${r-4} and a−b=${r}`,`2a−b=${r-4} and a+b=${3*r+1}`],`Use P(2)=0 and P(−1)=${r}. Substitution produces two simultaneous equations; solve them rather than guessing coefficients.`));bank.push(sh(`A geometric sequence has first term ${p} and common ratio ${q+1}. Find the smallest n for which the nth term exceeds ${p*(q+1)**5}.`,[7],`u_n=${p}(${q+1})^(n−1). To exceed the 6th-term threshold, n must be at least 7.`));bank.push(mc(`The graph of y=f(x) has domain [−3,5] and range [−2,7]. What are the domain and range of y=−2f(x−4)+1?`,`Domain [1,9], range [−13,5]`,[`Domain [−7,1], range [−3,15]`,`Domain [1,9], range [−3,15]`,`Domain [−3,5], range [−13,5]`],`x−4 must lie in [−3,5], so x∈[1,9]. Multiplying range by −2 reverses endpoints: [−14,4], then +1 gives [−13,5].`));bank.push(sh(`Solve exactly: log₂(x−1)+log₂(x−3)=3. Give the larger valid solution.`,[5],`Combine logs: (x−1)(x−3)=8 ⇒ x²−4x−5=0 ⇒ x=5 or −1. Domain requires x>3, so x=5.`));bank.push(mc(`For f(x)=x²−6x+5 restricted to x≥3, which is f⁻¹(x)?`,`3+√(x+4)`,[`3−√(x+4)`,`6+√(x−5)`,`√(x+5)−3`],`f(x)=(x−3)²−4. With x≥3 choose the positive square-root branch: f⁻¹(x)=3+√(x+4).`));bank.push(sh(`The roots α and β of 2x²−${p+4}x+${p}=0 satisfy α²+β² = ? Give a decimal or fraction.`,[((p+4)/2)**2-p],`α+β=(${p+4})/2 and αβ=${p}/2. Then α²+β²=(α+β)²−2αβ.`));bank.push(mc(`If f(x)=|x²−4x+3|, how many solutions does f(x)=2 have?`,`4`,[`1`,`2`,`3`],`Solve x²−4x+3=2 and x²−4x+3=−2. Both quadratics have two distinct real roots, giving four solutions.`));bank.push(sh(`Given 3^(2x−1)=7, express x numerically to 3 d.p.`,[(1+Math.log(7)/Math.log(3))/2],`Take logs: (2x−1)ln3=ln7 ⇒ x=(1+ln7/ln3)/2 ≈ ${((1+Math.log(7)/Math.log(3))/2).toFixed(3)}.`));return shuffle([...bank,...bank]).slice(0,20)}
function physics(){let bank=[];let a=R(2,5),t=R(3,6),u=R(4,10);let s=u*t+.5*a*t*t;bank.push(sh(`A particle passes point A at ${u} m s⁻¹ and accelerates uniformly at ${a} m s⁻². It travels ${s} m. Find the time taken.`,[t],`Use s=ut+½at²: ${s}=${u}t+${a/2}t². Solve the quadratic and reject the negative-time root. t=${t} s.`));bank.push(sh(`A ball is projected vertically upward at 24 m s⁻¹. Take g=9.81 m s⁻². Find the maximum height above launch point to 3 s.f.`,[(24*24/(2*9.81)).toFixed(3),(24*24/(2*9.81)).toFixed(2)],`At maximum height v=0. Use v²=u²+2as: 0=24²−2(9.81)s, so s≈${(24*24/(2*9.81)).toFixed(3)} m.`));bank.push(mc(`A car moving at 20 m s⁻¹ sees an obstacle. Reaction time is 0.70 s, then it brakes uniformly at 5.0 m s⁻². What is the total stopping distance?`,`54 m`,[`40 m`,`47 m`,`68 m`],`Thinking distance=20×0.70=14 m. Braking distance from 0=20²−2(5)s is 40 m. Total=54 m.`));bank.push(sh(`Two cyclists start together. A moves at constant 8 m s⁻¹. B starts from rest with constant acceleration 2 m s⁻². After how many seconds does B catch A (excluding t=0)?`,[8],`Equate displacements: 8t=½(2)t²=t². Thus t=8 s.`));bank.push(mc(`The graph shows a particle's velocity. What is its displacement from t=0 to 16 s?`,`147 m`,[`96 m`,`120 m`,`192 m`],`Area under v–t graph: triangle 0–4 =24; rectangle 4–10=72; trapezium 10–16 = (12+3)/2×6=45. Total=141 m. Note: inspect graph carefully; if endpoint is interpreted as 3 m/s, 141 m is the physically consistent result.`,vt()));bank[bank.length-1].answer='141 m';bank[bank.length-1].options=shuffle(['141 m','96 m','120 m','192 m']);bank.push(mc(`A particle has positive velocity but negative acceleration. Which statement must be true at that instant?`,`Its speed is decreasing.`,[`It is moving in the negative direction.`,`Its displacement is negative.`,`Its speed is increasing.`],`Velocity and acceleration have opposite signs, so the magnitude of velocity is decreasing.`));bank.push(sh(`A stone is dropped from rest from a height of 45.0 m. Ignore air resistance and use g=9.81 m s⁻². Find impact speed to 3 s.f.`,[(Math.sqrt(2*9.81*45)).toFixed(3),(Math.sqrt(2*9.81*45)).toFixed(2)],`v²=u²+2as=2(9.81)(45), giving v≈${Math.sqrt(2*9.81*45).toFixed(3)} m s⁻¹.`));bank.push(mc(`A student estimates acceleration by taking the gradient between two widely separated points on a curved velocity–time graph. What quantity have they found?`,`Average acceleration over that interval.`,[`Instantaneous acceleration at the midpoint exactly.`,`Displacement.`,`Average velocity.`],`A secant gradient gives Δv/Δt, the average acceleration. Instantaneous acceleration requires a tangent.`));bank.push(sh(`A train slows uniformly from 30 m s⁻¹ to 12 m s⁻¹ over 315 m. Find its acceleration to 3 s.f.`,[((12*12-30*30)/(2*315)).toFixed(3)],`Use v²=u²+2as. a=(12²−30²)/(2×315)=${((144-900)/630).toFixed(3)} m s⁻².`));bank.push(mc(`Object X is thrown upward while object Y is released from rest from a point above X at the same instant. Neglect air resistance. Which statement is correct before either hits the ground?`,`Both objects have the same downward acceleration.`,[`They have equal velocities at all times.`,`X has upward acceleration while rising.`,`Y has zero acceleration until it gains speed.`],`Gravity gives both the same constant downward acceleration throughout flight.`));return shuffle([...bank,...bank]).slice(0,20)}
function econ(){let bank=[];bank.push(mc(`A market begins at equilibrium. Household income rises for a normal good while, simultaneously, firms experience a rise in production costs. Which conclusion is certain?`,`Equilibrium price rises; the effect on equilibrium quantity is ambiguous.`,[`Both equilibrium price and quantity rise.`,`Price falls and quantity rises.`,`Quantity falls while price is ambiguous.`],`Demand shifts right and supply shifts left. Both push price upward, but they push quantity in opposite directions.`,econGraph('D+')));bank.push(mc(`Demand increases from D0 to D1. At the original equilibrium price, which sequence best explains how the price mechanism restores equilibrium?`,`Excess demand → upward pressure on price → contraction in quantity demanded and extension in quantity supplied.`,[`Excess supply → price rises → demand shifts left.`,`Excess demand → supply shifts right automatically.`,`Shortage → price falls → quantity demanded rises.`],`At the old price Qd>Qs. A higher price creates movements along both existing curves until Qd=Qs.`,econGraph('D+')));bank.push(mc(`Coffee and tea are substitutes. Coffee becomes more expensive while a technological improvement lowers the cost of producing tea. What is the likely effect in the tea market?`,`Tea equilibrium quantity rises; the effect on tea price is ambiguous.`,[`Tea price and quantity both certainly rise.`,`Tea price certainly falls and quantity is ambiguous.`,`Tea demand falls and supply rises.`],`Coffee's higher price shifts tea demand right; lower tea costs shift tea supply right. Both increase Q, while P receives opposing pressures.`));bank.push(mc(`A market is at equilibrium where MB=MC. Consumers then develop a stronger preference for the good. Before price adjusts, which statement best describes the old quantity?`,`At the new demand conditions, MB exceeds MC at the old quantity.`,[`MC exceeds MB because demand increased.`,`MB=MC must still hold.`,`Both MB and MC become zero.`],`A rightward demand/MB shift raises marginal benefit at the old Q, creating gains from increasing output.`));bank.push(mc(`A leftward shift of supply is shown. At the old equilibrium price, what is the immediate disequilibrium and what market signal follows?`,`A shortage; upward pressure on price.`,[`A surplus; upward pressure on price.`,`A shortage; downward pressure on price.`,`A surplus; demand shifts right.`],`Reduced supply means Qs<Qd at the old price. Competition among buyers puts upward pressure on price.`,econGraph('S-')));bank.push(mc(`Suppose demand is Qd=100−2P and supply is Qs=20+2P. What are equilibrium P and Q?`,`P=20, Q=60`,[`P=15, Q=70`,`P=25, Q=50`,`P=30, Q=40`],`Set Qd=Qs: 100−2P=20+2P ⇒ P=20; substitute to obtain Q=60.`));bank.push(mc(`At P=15 in the market Qd=100−2P and Qs=20+2P, what exists?`,`Excess demand of 20 units.`,[`Excess supply of 20 units.`,`Excess demand of 10 units.`,`Equilibrium.`],`Qd=70 and Qs=50, so shortage/excess demand=20.`));bank.push(mc(`A fall in the price of a good causes quantity demanded to rise. Which statement is analytically correct?`,`This is an extension of demand, not an increase in demand.`,[`Demand shifts right.`,`Supply shifts left.`,`The demand curve becomes flatter.`],`A change in the good's own price causes movement along the demand curve; non-price determinants shift it.`));bank.push(mc(`Demand for bus travel rises after petrol prices increase. The strongest explanation is that…`,`cars and bus travel can act as substitutes for some consumers.`,[`bus travel is necessarily an inferior good.`,`the law of demand has failed.`,`bus supply must have fallen.`],`A rise in the price of a substitute can increase demand for the related good.`));bank.push(mc(`Which change can raise equilibrium quantity while leaving the direction of equilibrium price theoretically indeterminate?`,`An increase in both demand and supply.`,[`A decrease in both demand and supply.`,`An increase in demand and decrease in supply.`,`A decrease in demand with unchanged supply.`],`D↑ raises P,Q; S↑ lowers P but raises Q. Thus Q rises unambiguously while P depends on relative shift sizes.`));return shuffle([...bank,...bank]).slice(0,20)}
function business(){let bank=[];bank.push(mc(`A school-food company states: “To make healthy lunches accessible to every student in Türkiye.” It then sets a three-year objective to enter 20 cities and, this month, launches a pilot in two schools. Which classification is strongest?`,`The statement is a vision/mission-level direction; entering 20 cities is strategic; the two-school pilot is tactical.`,[`All three are tactics.`,`The 20-city target is a mission and the pilot is a vision.`,`The statement is tactical because it mentions customers.`],`IB Business distinguishes broad purpose/direction from longer-term strategic choices and short-term actions used to implement them.`));bank.push(mc(`A premium sportswear firm has a mission centred on durability and sustainability. Management considers a tactic of switching to a cheaper material that halves product life. What is the strongest concern?`,`The tactic may improve short-term cost performance but conflict with the firm's mission and strategic positioning.`,[`A tactic can never affect strategy.`,`Mission statements concern only employees.`,`Lower cost automatically makes the tactic strategically consistent.`],`A good tactic should support, not undermine, the strategic direction and stated purpose.`));bank.push(mc(`A firm’s vision is to become the most trusted digital bank for teenagers. Which objective is most useful for translating that vision into strategy?`,`Reach 250,000 active teen accounts with an NPS above 60 within three years.`,[`Be excellent.`,`Post more on social media.`,`Become trusted someday.`],`A strategic objective should be specific and measurable enough to guide resource allocation and evaluate progress.`));bank.push(mc(`A retailer copies a competitor's short-term discount campaign even though its own strategy is premium differentiation. Which risk is most significant?`,`The tactic may weaken perceived differentiation and create strategic inconsistency.`,[`Tactics do not influence brand positioning.`,`Premium firms cannot change prices.`,`Competitor actions should always determine mission.`],`Short-term actions need alignment with the chosen strategy and positioning.`));bank.push(mc(`A start-up changes its mission every month in response to individual customer requests. Which criticism is strongest?`,`It risks confusing enduring organizational purpose with short-term tactical adaptation.`,[`Mission must legally remain unchanged forever.`,`Customer feedback should never affect strategy.`,`Tactics must always last longer than missions.`],`Mission is relatively enduring; tactics are the more flexible level for short-term adaptation.`));bank.push(mc(`A company has limited capital. Strategy A opens five owned stores; Strategy B uses e-commerce partnerships. Both support the same growth objective. What should management compare most directly?`,`Resource requirements, risk, control and consistency with the firm's objectives.`,[`Only which strategy sounds more ambitious.`,`Only the CEO's personal preference.`,`Whether either option changes the definition of revenue.`],`Strategy selection requires evaluating feasibility and trade-offs, not just stated ambition.`));bank.push(mc(`A business meets its annual sales target through heavy discounting, but margins collapse and repeat purchase falls. What does this most clearly show?`,`A single objective can be achieved while the underlying strategy performs poorly on other important measures.`,[`Meeting one target proves the strategy is successful.`,`Objectives should never be quantitative.`,`Sales revenue and profit are identical.`],`IB-style evaluation requires considering multiple indicators and trade-offs rather than judging success from one metric.`));bank.push(mc(`Management wants employees to use the mission statement in daily decisions. Which action best operationalizes that goal?`,`Link team objectives and decision criteria explicitly to the mission, then review outcomes against them.`,[`Print the mission in a larger font only.`,`Replace all tactical plans with the mission statement.`,`Remove measurable objectives.`],`Alignment is created by connecting broad purpose to objectives, strategy and tactical decision criteria.`));bank.push(mc(`A firm has the strategic objective of reducing delivery time by 30% in two years. Which is a tactic rather than a strategy?`,`Trial route-optimization software in the Istanbul delivery team next month.`,[`Build an integrated logistics capability across the company.`,`Pursue operational excellence as the basis of competitive advantage.`,`Reconfigure the national distribution network.`],`A limited, near-term implementation action is tactical; the broader resource/configuration choices are strategic.`));bank.push(mc(`Why can a highly inspiring vision still fail to improve performance?`,`Because without coherent objectives, strategies, resources and tactics, it may not change actual decisions.`,[`Because visions must contain financial ratios.`,`Because only tactics matter in business.`,`Because missions and visions are legally binding forecasts.`],`A vision guides direction, but execution requires aligned objectives and actions.`));return shuffle([...bank,...bank]).slice(0,20)}
function build(s){return s==='math'?math():s==='physics'?physics():s==='econ'?econ():business()}
let questions=[],i=0,score=0,answered=false,subject='';function start(s){subject=s;questions=build(s);i=0;score=0;answered=false;home.classList.add('hidden');quiz.classList.remove('hidden');render()}function norm(x){return String(x).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'.')}function render(){let q=questions[i],name={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL'}[subject];let ans=q.type==='mc'?`<div class="options">${q.options.map((o,k)=>`<button class="option" data-v="${encodeURIComponent(o)}" onclick="choose(this)">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}</div>`:`<input id="short" class="textanswer" placeholder="Enter your final answer…" onkeydown="if(event.key==='Enter')check()">`;quiz.innerHTML=`<div class="card"><div class="qnum">${name} • Question ${i+1}/20 • IB Challenge</div><div class="progress"><div style="width:${(i+1)*5}%"></div></div><div class="question">${q.q}</div>${q.visual||''}${ans}<div id="fb"></div><div class="actions"><button class="btn" onclick="quit()">Exit</button><button id="check" class="btn primary" onclick="check()">Check answer</button></div></div>`}function choose(e){if(answered)return;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));e.classList.add('selected')}function check(){if(answered){next();return}let q=questions[i],ok=false;if(q.type==='mc'){let e=document.querySelector('.option.selected');if(!e)return;ok=decodeURIComponent(e.dataset.v)===q.answer}else{let v=document.getElementById('short').value.trim();if(!v)return;let n=parseFloat(v);ok=q.answers.some(a=>norm(v)===norm(a)||(isFinite(n)&&isFinite(parseFloat(a))&&Math.abs(n-parseFloat(a))<0.015))}answered=true;if(ok)score++;let f=document.getElementById('fb');f.className='feedback '+(ok?'correct':'wrong');f.innerHTML=(ok?'<b>✓ Correct.</b>':'<b>✗ Incorrect.</b>')+`<br>${q.explain}`;document.getElementById('check').textContent=i===19?'See result':'Next question'}function next(){if(i===19)return finish();i++;answered=false;render()}function finish(){quiz.innerHTML=`<div class="card result"><div class="meta">IB CHALLENGE COMPLETE</div><div class="score">${score}/20</div><h2>${score>=17?'Excellent':score>=14?'Strong':score>=10?'Developing':'Review the worked solutions'}</h2><div class="actions" style="justify-content:center"><button class="btn" onclick="quit()">Choose subject</button><button class="btn primary" onclick="start(subject)">New hard quiz</button></div></div>`}function quit(){quiz.classList.add('hidden');home.classList.remove('hidden')}</script></body></html>
