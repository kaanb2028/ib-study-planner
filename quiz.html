<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take Quiz — IB Study Planner</title>
<style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5;--good:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.back{color:var(--accent);text-decoration:none;font-weight:700}.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.subject{border:1px solid var(--line);background:#fff;border-radius:16px;padding:20px;text-align:left;cursor:pointer;min-height:125px}.subject strong{display:block;font-size:18px;margin-bottom:6px}.subject span,.meta{font-size:12px;color:var(--muted)}.subject:hover{box-shadow:0 5px 18px rgba(0,0,0,.06)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}.progress{height:8px;background:#e9eaf0;border-radius:999px;overflow:hidden;margin:12px 0 22px}.progress div{height:100%;background:var(--accent)}.qnum{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.question{font-size:21px;font-weight:750;line-height:1.4;margin:10px 0 18px}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;cursor:pointer}.option:hover{border-color:#a5b4fc}.option.selected{border-color:var(--accent);background:#eef2ff}.textanswer{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;gap:9px;justify-content:space-between;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.feedback{margin-top:15px;padding:14px;border-radius:11px;line-height:1.5}.correct{background:#ecfdf3;color:#05603a}.wrong{background:#fef3f2;color:#912018}.result{text-align:center;padding:28px}.score{font-size:56px;font-weight:900;margin:10px}.hidden{display:none!important}@media(max-width:800px){.subjects{grid-template-columns:1fr 1fr}.wrap{padding:16px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1 style="margin:0">Take Quiz</h1><div class="meta">20 questions every time • mixed formats • instant explanations</div></div><a class="back" href="./">← Planner</a></div>
<section id="home"><div class="subjects"><button class="subject" onclick="start('math')"><strong>📐 Math AA HL</strong><span>Algebra & functions</span></button><button class="subject" onclick="start('physics')"><strong>⚛️ Physics HL</strong><span>A.1 Kinematics</span></button><button class="subject" onclick="start('econ')"><strong>📈 Economics HL</strong><span>Foundations & competitive markets</span></button><button class="subject" onclick="start('business')"><strong>💼 Business</strong><span>Introduction to Business Management</span></button></div><div class="card meta"><b>Quiz mode:</b> each attempt creates a fresh 20-question set. Multiple-choice and short-answer questions are mixed. Wrong answers immediately show the correct answer and an explanation.</div></section><section id="quiz" class="hidden"></section></div>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)],shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function mc(q,correct,wrong,explain){return{type:'mc',q,options:shuffle([correct,...wrong]),answer:correct,explain}}function short(q,answers,explain){return{type:'short',q,answers,explain}}
const common={math:[
()=>mc('An equation true for every possible value of its variable is called…','an identity.',['a root.','an inequality.','a parameter.'],'An identity is true for all permissible values of the variable.'),
()=>mc('Two distinct non-vertical parallel lines must have…','equal gradients.',['gradients whose product is -1.','opposite y-intercepts.','equal x-intercepts.'],'Parallel non-vertical lines have equal gradients.'),
()=>mc('Two non-vertical perpendicular lines have gradients that are…','negative reciprocals.',['equal.','both positive.','both zero.'],'Perpendicular gradients are negative reciprocals.'),
()=>short('What is the set of allowable input values of a function called?',['domain'],'The allowable input values form the domain.'),
()=>short('What is the set of output values of a function called?',['range'],'The outputs form the range.'),
()=>mc('f(g(x)) is called…','a composite function.',['an inverse function.','a linear identity.','a discriminant.'],'Applying one function inside another is composition.'),
()=>mc('The graph y = |f(x)| does what to negative outputs of f?','Reflects them above the x-axis.',['Deletes them.','Reflects them across the y-axis.','Moves them left.'],'Absolute value makes negative outputs positive.'),
()=>mc('The discriminant of a quadratic helps determine…','the nature/number of real roots.',['the gradient of a line.','the domain of every function.','the midpoint only.'],'b²−4ac indicates the nature of quadratic roots.'),
()=>mc('A self-inverse function satisfies…','f(f(x)) = x.',['f(x)=0 always.','f(x)=x² always.','f has no domain.'],'Applying a self-inverse function twice returns the original input.'),
()=>mc('Which form directly shows a line’s gradient and y-intercept?','y = mx + c',['ax + by = c','x = c','y = c only'],'Slope-intercept form displays both directly.'),
()=>mc('A root of an equation is…','a value that makes the equation true.',['always the y-intercept.','a graph title.','a value making every equation false.'],'Solutions or roots satisfy the equation.')],
physics:[
()=>mc('Distance is a…','scalar quantity.',['vector quantity.','unitless quantity.','direction only.'],'Distance records total path length and has no direction.'),
()=>mc('Displacement is a…','vector quantity.',['scalar quantity.','time interval.','speedometer reading.'],'Displacement includes magnitude and direction.'),
()=>mc('Average speed equals…','total distance ÷ time.',['displacement ÷ time.','time ÷ distance.','acceleration × time.'],'Average speed uses total path length divided by elapsed time.'),
()=>mc('Average velocity equals…','displacement ÷ time.',['distance ÷ time regardless of direction.','time ÷ displacement.','speed × distance.'],'Average velocity uses net displacement.'),
()=>mc('A runner completes one full lap and returns to the start. Net displacement is…','0 m.',['equal to lap distance.','always negative.','undefined.'],'Start and finish positions are the same.'),
()=>mc('On a position-time graph, average velocity is represented by…','the slope joining start and end points.',['the area under the graph.','the y-intercept only.','the maximum position.'],'Average velocity is Δs/Δt.'),
()=>mc('Instantaneous velocity on a position-time graph is…','the gradient of the tangent at that instant.',['the total area.','always zero.','the x-intercept.'],'The tangent gradient gives the instantaneous rate of change of position.'),
()=>mc('The SI unit of speed and velocity is…','m s⁻¹',['m s⁻²','m²','s m⁻¹'],'Both use metres per second.'),
()=>mc('A speedometer directly gives…','speed.',['displacement.','direction.','net velocity vector.'],'A speedometer gives magnitude, not direction.'),
()=>mc('A quantity with magnitude and direction is…','a vector.',['a scalar.','a constant.','a unit.'],'Vectors have magnitude and direction.'),
()=>mc('Which best describes displacement?','Shortest straight-line change from initial to final position with direction.',['Total path travelled.','Time spent moving.','Change in velocity.'],'Displacement depends on start and finish positions and direction.')],
econ:[
()=>mc('A market is best defined as…','a place/system where buyers and sellers exchange goods or services.',['only a physical shop.','only a stock exchange.','a government department.'],'Markets can be physical or virtual.'),
()=>mc('Demand is the quantity consumers are…','willing and able to buy at a given price during a specific time period.',['willing but not able to buy.','able but never willing.','required by law to buy.'],'Demand requires willingness and ability.'),
()=>mc('The law of demand says, ceteris paribus, when price rises…','quantity demanded falls.',['quantity demanded rises.','demand must shift right.','supply disappears.'],'Price and quantity demanded have an inverse relationship.'),
()=>mc('Ceteris paribus means…','all else being equal/constant.',['prices always rise.','consumers are irrational.','markets are physical.'],'Other relevant factors are held constant.'),
()=>mc('Market demand is found by…','summing individual demands.',['subtracting them.','using one consumer only.','ignoring quantity.'],'Market demand aggregates individual demand.'),
()=>mc('The substitution effect means consumers tend to switch toward…','a relatively cheaper substitute.',['the most expensive good.','complements only.','goods they cannot buy.'],'Relative price changes can cause substitution.'),
()=>mc('Diminishing marginal utility means additional units tend to provide…','smaller additional satisfaction.',['ever-increasing satisfaction.','zero total utility immediately.','higher prices automatically.'],'Marginal utility tends to diminish.'),
()=>mc('For a normal good, when income rises, demand generally…','increases.',['decreases.','becomes zero.','turns into supply.'],'Normal-good demand moves with income.'),
()=>mc('For an inferior good, when income rises, demand generally…','decreases.',['increases.','must stay identical.','becomes perfectly elastic.'],'Consumers may switch away from inferior goods as income rises.'),
()=>mc('If the price of a substitute rises, demand for the other substitute tends to…','increase.',['decrease.','become zero.','be unrelated.'],'Consumers shift toward the relatively cheaper substitute.'),
()=>mc('If the price of a complement rises, demand for the related good tends to…','decrease.',['increase.','double automatically.','become supply.'],'Complements are consumed together.'),
()=>short('What term means “all else being equal”?',['ceteris paribus'],'Ceteris paribus means other relevant factors are held constant.'),
()=>mc('A movement along a demand curve is caused by…','a change in the good’s own price.',['a change in tastes.','a change in income.','a change in number of buyers.'],'Own-price changes alter quantity demanded; non-price determinants shift demand.')],
business:[
()=>mc('A business is best described as…','a decision-making organization using inputs to produce goods and/or services.',['only a profit figure.','only a government office.','an organization with no inputs.'],'The notes define business through decision-making and converting inputs into outputs.'),
()=>mc('Which is an input into business activity?','Labour',['Finished goods','Customer service output','Sales revenue only'],'Labour is one of the inputs used in production.'),
()=>mc('Which is an input into business activity?','Capital',['A finished service','A completed product','A customer review'],'Capital is a factor/input.'),
()=>mc('Which functional area manages personnel?','Human resources',['Finance','Marketing','Operations only'],'HR manages workforce planning, recruitment and training.'),
()=>mc('Finance and accounts primarily manages…','the organization’s money.',['only product design.','only recruitment.','only packaging.'],'Finance/accounts manages money and financial records.'),
()=>mc('Marketing is responsible for…','identifying and meeting customer needs and wants.',['only dismissing staff.','only recording taxes.','only converting raw materials.'],'Marketing focuses on customer needs and wants.'),
()=>mc('Which is one of the seven Ps of marketing?','Product',['Payroll','Probability','Parabola'],'Product is one of the seven Ps.'),
()=>mc('Which is one of the seven Ps of marketing?','Physical evidence',['Physical velocity','Personal tax','Primary data only.'],'Physical evidence is one of the seven Ps.'),
()=>mc('Operations management is responsible for…','converting raw materials/components into finished goods and providing services.',['only hiring staff.','only shareholder reporting.','only advertising.'],'Operations manages transformation processes.'),
()=>mc('Functional areas are interdependent because…','they must work together to achieve organizational goals.',['they never interact.','each has unrelated goals.','only finance makes decisions.'],'Effective organizations require coordination.'),
()=>mc('A bakery mixing ingredients is an example of…','a process.',['an output.','a final customer.','a market sector only.'],'Mixing transforms inputs.'),
()=>mc('Bread produced by a bakery is an example of…','an output.',['an input.','a recruitment method.','a financial market.'],'Bread is a finished good/output.'),
()=>short('Which functional area is responsible for workforce planning and recruitment?',['human resources','hr'],'Human resources manages workforce planning and recruitment.'),
()=>short('Which functional area identifies and meets customer needs and wants?',['marketing'],'That function is marketing.') ]};
function dynamic(s){if(s==='math'){let m=R(-5,5)||2,b=R(-8,8),x=R(-5,5),y=m*x+b;return pick([()=>mc(`For y = ${m}x + ${b}, what is the gradient?`,String(m),[String(b),String(-m),String(m+1)],'In y = mx + c, m is the gradient.'),()=>short(`For y=${m}x+${b}, find y when x=${x}.`,[String(y)],`Substitute x=${x}: y=${m}(${x})+${b}=${y}.`),()=>mc(`If a line has gradient ${m}, a perpendicular line has gradient…`,String(-1/m),[String(m),String(-m),String(1/m)],'Perpendicular gradients are negative reciprocals.')])()}
if(s==='physics'){let d=R(20,120),t=R(2,10),v=+(d/t).toFixed(2);return pick([()=>short(`An object travels ${d} m in ${t} s. Find its average speed in m/s.`,[String(v)],`Average speed = ${d}/${t} = ${v} m/s.`),()=>mc(`An object travels ${d} m in ${t} s. Its average speed is…`,`${v} m/s`,[`${d*t} m/s`,`${t/d} m/s`,`0 m/s`],`Average speed = distance/time = ${d}/${t} = ${v} m/s.`)])()}
if(s==='econ')return pick(common.econ)();return pick(common.business)()}
function build(s){let q=shuffle(common[s]).slice(0,Math.min(14,common[s].length)).map(f=>f());while(q.length<20)q.push(dynamic(s));return shuffle(q)}
let questions=[],i=0,score=0,answered=false,subject='';function start(s){subject=s;questions=build(s);i=0;score=0;answered=false;home.classList.add('hidden');quiz.classList.remove('hidden');render()}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(/[×*]/g,'x').replace(/÷/g,'/').replace(/−/g,'-')}
function render(){let q=questions[i],name={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business'}[subject];let ans=q.type==='mc'?`<div class="options">${q.options.map((o,k)=>`<button class="option" data-v="${encodeURIComponent(o)}" onclick="choose(this)">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}</div>`:`<input id="short" class="textanswer" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')check()">`;quiz.innerHTML=`<div class="top"><div><h1 style="margin:0">${name} Quiz</h1><div class="meta">Fresh 20-question set</div></div></div><div class="card"><div class="qnum">Question ${i+1} of 20</div><div class="progress"><div style="width:${(i+1)*5}%"></div></div><div class="question">${q.q}</div>${ans}<div id="fb"></div><div class="actions"><button class="btn" onclick="quit()">Exit</button><button id="check" class="btn primary" onclick="check()">Check answer</button></div></div>`}
function choose(el){if(answered)return;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function check(){if(answered){next();return}let q=questions[i],ok=false,user='';if(q.type==='mc'){let el=document.querySelector('.option.selected');if(!el)return;user=decodeURIComponent(el.dataset.v);ok=user===q.answer}else{let el=document.getElementById('short');user=el.value.trim();if(!user)return;ok=q.answers.some(a=>norm(user)===norm(a)||norm(user).includes(norm(a)))}answered=true;if(ok)score++;let fb=document.getElementById('fb');fb.className='feedback '+(ok?'correct':'wrong');fb.innerHTML=ok?`<b>✓ Correct.</b><br>${q.explain}`:`<b>✗ Not quite.</b><br><b>Correct answer:</b> ${q.type==='mc'?q.answer:q.answers[0]}<br>${q.explain}`;let b=document.getElementById('check');b.textContent=i===19?'See result':'Next question'}
function next(){if(i===19){finish();return}i++;answered=false;render()}function finish(){let pct=Math.round(score/20*100);quiz.innerHTML=`<div class="card result"><div class="meta">QUIZ COMPLETE</div><div class="score">${score}/20</div><h2>${pct}%</h2><p>${score>=17?'Strong work.':score>=13?'Good base — review the explanations you missed.':'Use the corrections as your next revision list.'}</p><div class="actions" style="justify-content:center"><button class="btn" onclick="quit()">Choose subject</button><button class="btn primary" onclick="start(subject)">New 20-question quiz</button></div></div>`}function quit(){quiz.classList.add('hidden');home.classList.remove('hidden')}
</script></body></html>
