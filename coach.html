<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Study Coach</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px 16px}.brand{font-size:20px;font-weight:800;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px}.side a{display:block;color:#d1d5db;text-decoration:none;padding:11px 12px;border-radius:10px;margin:4px 0}.side a:hover,.side a.active{background:#1f2937;color:white}.main{padding:28px;max-width:1100px;width:100%;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.meta{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:white;border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.item{border-left:5px solid var(--accent)}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-right:5px}.good{color:#067647}.hidden{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.side nav{display:flex;overflow:auto}.side a{white-space:nowrap}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><nav><a href="./">Today</a><a href="./">Week</a><a href="./">Deadlines</a><a href="./">Subjects</a><a href="./">Classroom</a><a href="quiz.html" >🧠 Take Quiz</a><a href="mistakes.html" >❌ Mistake Bank</a><a href="coach.html" class="active">✨ AI Study Coach</a></nav></aside><main class="main"><h1>✨ AI Study Coach</h1><p class="meta">A smart local coach that uses your deadlines and Mistake Bank. No external AI account or API is required.</p><div class="card"><h2>How much time do you have right now?</h2><div class="filters"><button class="btn primary" onclick="coach(25)">25 min</button><button class="btn primary" onclick="coach(45)">45 min</button><button class="btn primary" onclick="coach(60)">60 min</button><button class="btn primary" onclick="coach(90)">90 min</button></div></div><div id="out"></div></main></div><script>
const deadlines=[{s:'turkish',t:'Turkish Portfolio',d:'2026-10-02'},{s:'math',t:'Math HL Quiz',d:'2026-10-05'},{s:'turkish',t:'Şeyh Bedrettin reading',d:'2026-10-05'},{s:'econ',t:'Economics HL Quiz',d:'2026-10-06'},{s:'physics',t:'Physics HL Quiz',d:'2026-10-06'},{s:'physics',t:'Physics Lab',d:'2026-10-06'},{s:'business',t:'Business SL Quiz',d:'2026-10-13'}];
const names={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',turkish:'Turkish SL'};
function mistakes(){return JSON.parse(localStorage.getItem('ib-mistakes')||'[]').filter(x=>!x.mastered)}
function today(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function days(s){return Math.ceil((new Date(s+'T12:00:00')-today())/86400000)}
function coach(min){let ms=mistakes(),counts={};ms.forEach(x=>counts[x.subject]=(counts[x.subject]||0)+(x.wrongCount||1));let upcoming=deadlines.filter(x=>days(x.d)>=0).sort((a,b)=>days(a.d)-days(b.d));let target=upcoming[0];let weak=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];if(weak&&(!target||counts[weak]>=3))target={s:weak,t:'Weak-topic repair',d:null};let subject=target?target.s:'math',title=target?target.t:'Math AA HL practice';let weakTopics=ms.filter(x=>x.subject===subject).sort((a,b)=>(b.wrongCount||1)-(a.wrongCount||1));let topic=weakTopics[0]?.topic||({math:'Functions / Algebra',physics:'Kinematics',econ:'Price Mechanism',business:'Vision, Mission, Strategy & Tactics',turkish:'Writing'}[subject]);let parts=[];if(min<=25)parts=[['5 min','Recall key method/formulas without notes'],['15 min','Solve 3–4 hard questions on '+topic],['5 min','Check mistakes and write one correction rule']];else if(min<=45)parts=[['8 min','Fast review of '+topic],['27 min','Solve 6–8 IB-style questions'],['10 min','Mark, redo every wrong answer, update Mistake Bank']];else if(min<=60)parts=[['10 min','Active recall / formula or concept map'],['35 min','Hard IB problem set'],['15 min','Corrections + one timed retry']];else parts=[['15 min','Review only weak points'],['50 min','Timed IB-style set'],['15 min','Mark and analyse errors'],['10 min','Retry the two hardest questions']];out.innerHTML='<div class="card"><div class="meta">COACH RECOMMENDATION · '+min+' MIN</div><h2>'+names[subject]+' — '+title+'</h2><p><b>Focus:</b> '+topic+(target&&target.d?' · <b>'+days(target.d)+' day(s) to deadline</b>':'')+'</p>'+parts.map(x=>'<div style="padding:10px 0;border-top:1px solid #e7e9f0"><b>'+x[0]+'</b> — '+x[1]+'</div>').join('')+(weakTopics.length?'<p class="meta">Why this? You currently have '+weakTopics.length+' active mistake(s) in this subject, so the coach is prioritizing retrieval + correction.</p>':'<p class="meta">Why this? The coach is prioritizing your nearest deadline.</p>')+'<a class="btn primary" href="quiz.html" style="display:inline-block;text-decoration:none;margin-top:8px">Start quiz</a> <a class="btn" href="mistakes.html" style="display:inline-block;text-decoration:none;margin-top:8px">Open Mistake Bank</a></div>'}
</script></body></html>
