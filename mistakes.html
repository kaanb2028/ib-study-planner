<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mistake Bank</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px 16px}.brand{font-size:20px;font-weight:800;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px}.side a{display:block;color:#d1d5db;text-decoration:none;padding:11px 12px;border-radius:10px;margin:4px 0}.side a:hover,.side a.active{background:#1f2937;color:white}.main{padding:28px;max-width:1100px;width:100%;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.meta{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:white;border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.item{border-left:5px solid var(--accent)}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-right:5px}.good{color:#067647}.hidden{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.side nav{display:flex;overflow:auto}.side a{white-space:nowrap}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><nav><a href="./">Today</a><a href="calendar.html">Calendar</a><a href="./">Deadlines</a><a href="./">Subjects</a><a href="./">Classroom</a><a href="quiz.html" >🧠 Take Quiz</a><a href="mistakes.html" class="active">❌ Mistake Bank</a><a href="coach.html" >✨ AI Study Coach</a></nav></aside><main class="main"><h1>Mistake Bank</h1><p class="meta">Every wrong quiz answer is saved here automatically. Retry them until they become mastered.</p><div class="filters"><button class="btn" onclick="setF('all')">All</button><button class="btn" onclick="setF('math')">Math</button><button class="btn" onclick="setF('physics')">Physics</button><button class="btn" onclick="setF('econ')">Economics</button><button class="btn" onclick="setF('business')">Business</button><button class="btn primary" onclick="startReview()">Quiz me on my mistakes</button></div><div id="stats" class="card"></div><div id="list"></div><div id="review" class="hidden"></div></main></div><script>
let filter='all',reviewItems=[],ri=0;
function data(){return JSON.parse(localStorage.getItem('ib-mistakes')||'[]')}
function save(a){localStorage.setItem('ib-mistakes',JSON.stringify(a))}
function label(s){return {math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL'}[s]||s}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function setF(x){filter=x;render()}
function mastered(k){let a=data().map(x=>x.key===k?{...x,mastered:true}:x);save(a);render()}
function removeM(k){save(data().filter(x=>x.key!==k));render()}
function render(){let a=data(),v=a.filter(x=>(filter==='all'||x.subject===filter));stats.innerHTML='<b>'+a.filter(x=>!x.mastered).length+' active mistakes</b> · '+a.filter(x=>x.mastered).length+' mastered · '+a.reduce((n,x)=>n+(x.wrongCount||1),0)+' total wrong attempts';list.innerHTML=v.length?v.map(x=>'<div class="card item"><span class="tag">'+label(x.subject)+'</span><span class="tag">'+esc(x.topic)+'</span>'+(x.mastered?'<span class="tag good">Mastered</span>':'')+'<h3>'+esc(x.question)+'</h3><div class="meta">Your last answer: '+esc(x.userAnswer)+' · Wrong '+(x.wrongCount||1)+' time(s)</div><p><b>Correct:</b> '+esc(x.correct)+'</p><p>'+esc(x.explain)+'</p><button class="btn primary" onclick="retryOne(\''+encodeURIComponent(x.key)+'\')">Retry</button> <button class="btn" onclick="mastered(\''+x.key.replace(/'/g,"\\'")+'\')">Mark mastered</button> <button class="btn" onclick="removeM(\''+x.key.replace(/'/g,"\\'")+'\')">Remove</button></div>').join(''):'<div class="card meta">No mistakes yet. Take a quiz and wrong answers will appear here.</div>'}
function retryOne(k){let key=decodeURIComponent(k),x=data().find(z=>z.key===key);if(!x)return;reviewItems=[x];ri=0;showReview()}
function startReview(){reviewItems=shuffle(data().filter(x=>!x.mastered)).slice(0,20);if(!reviewItems.length){alert('No active mistakes yet.');return}ri=0;showReview()}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function showReview(){list.classList.add('hidden');stats.classList.add('hidden');review.classList.remove('hidden');let x=reviewItems[ri];let input=x.type==='mc'?'<div>'+x.options.map(o=>'<button class="btn" style="display:block;margin:7px 0;width:100%;text-align:left" onclick="answer(\''+encodeURIComponent(o)+'\')">'+esc(o)+'</button>').join('')+'</div>':'<input id="ra" style="width:100%;padding:12px;border:1px solid #e7e9f0;border-radius:10px" placeholder="Your answer"><button class="btn primary" style="margin-top:10px" onclick="answer(document.getElementById(\'ra\').value)">Check</button>';review.innerHTML='<div class="card"><div class="meta">Mistake review '+(ri+1)+'/'+reviewItems.length+' · '+label(x.subject)+' · '+esc(x.topic)+'</div><h2>'+esc(x.question)+'</h2>'+input+'<div id="rf"></div></div>'}
function answer(v){let x=reviewItems[ri],ok=String(v).trim().toLowerCase()===String(x.correct).trim().toLowerCase();let f=document.getElementById('rf');f.innerHTML='<div class="card '+(ok?'good':'')+'"><b>'+(ok?'Correct ✓':'Not yet')+'</b><br>Correct answer: '+esc(x.correct)+'<br>'+esc(x.explain)+'</div><button class="btn primary" onclick="nextR()">Next</button>';if(ok){save(data().map(z=>z.key===x.key?{...z,mastered:true}:z))}}
function nextR(){ri++;if(ri>=reviewItems.length){review.classList.add('hidden');list.classList.remove('hidden');stats.classList.remove('hidden');render();return}showReview()}
render();</script></body></html>
