<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner — Calendar</title><style>:root{--line:#e5e7eb;--ink:#182235;--muted:#697386;--math:#7c3aed;--physics:#2878e8;--econ:#079669;--business:#d97706;--english:#db2777;--turkish:#dc2626;--sport:#12b8c8;--exam:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 18px;background:#fafafa;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:800;margin-bottom:22px}.brand small{display:block;font-size:12px;color:var(--muted)}.side a{display:block;padding:10px 12px;text-decoration:none;color:#374151;border-radius:10px}.side .active{background:#eef2ff;color:#3730a3;font-weight:700}.main{min-width:0}.top{height:76px;display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line)}.nav,.views{display:flex;gap:8px;align-items:center}.title{font-size:27px;font-weight:800}.btn{padding:8px 13px;border:1px solid var(--line);background:white;border-radius:20px;cursor:pointer}.btn.on{background:#eef0f3;font-weight:700}.cal{height:calc(100vh - 76px);overflow:auto}.month{display:grid;grid-template-columns:repeat(7,1fr);min-width:950px}.dow{text-align:center;padding:7px;color:var(--muted);border-bottom:1px solid var(--line)}.day{min-height:145px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}.num{text-align:right;font-size:13px}.other{background:#fafafa;color:#aaa}.ev,.slot{font-size:11px;padding:4px 5px;border-radius:5px;margin:2px 0;border-left:4px solid #777;background:#f3f4f6;cursor:pointer;overflow:hidden}.math{background:#f0eaff!important;border-color:var(--math)!important}.physics{background:#e9f2ff!important;border-color:var(--physics)!important}.econ{background:#e5f8f0!important;border-color:var(--econ)!important}.business{background:#fff1df!important;border-color:var(--business)!important}.english{background:#fce7f3!important;border-color:var(--english)!important}.turkish{background:#feeaea!important;border-color:var(--turkish)!important}.busy{background:#e2f8fa!important;border-color:var(--sport)!important}.exam{background:#fee2e2!important;border-color:var(--exam)!important;font-weight:800}.week{display:grid;grid-template-columns:64px repeat(7,1fr);min-width:980px}.wh{text-align:center;height:54px;padding:7px;border-bottom:1px solid var(--line)}.time,.lane{height:1080px;position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 44px,#edf0f4 45px)}.tl{position:absolute;right:6px;font-size:10px;color:#888;transform:translateY(-6px)}.slot{position:absolute;left:4px;right:4px;margin:0}.dayview{display:grid;grid-template-columns:70px 1fr;max-width:1050px;margin:auto}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px}.mini{border:1px solid var(--line);border-radius:12px;padding:10px}.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}.mc{padding:4px}.has{background:#eef2ff;border-radius:4px}.fab{position:fixed;right:25px;bottom:25px;width:52px;height:52px;border:0;border-radius:50%;background:#4f46e5;color:white;font-size:27px}.back{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:10}.modal{width:min(460px,92vw);background:white;border-radius:16px;padding:20px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700}.field input,.field select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;justify-content:space-between;margin-top:15px}.danger{color:#b42318}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:8px}.title{font-size:20px}.year{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><a href="index.html">Today</a><a class="active" href="calendar.html">Calendar</a><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></aside><main class="main"><div class="top"><div class="nav"><button class="btn" id="today">Today</button><button class="btn" id="prev">‹</button><button class="btn" id="next">›</button><span class="title" id="title"></span></div><div class="views"><button class="btn" data-v="day">Day</button><button class="btn" data-v="week">Week</button><button class="btn" data-v="month">Month</button><button class="btn" data-v="year">Year</button></div></div><div class="cal" id="cal"></div></main></div><button class="fab" id="addBtn">+</button><div id="modal"></div><script>const names={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL'},pools={math:['Functions & graphs — 8 IB questions','Quadratics — 10 questions','Graph transformations — 8 questions'],physics:['Kinematics — 8 questions','Motion graphs — 8 questions','SUVAT — 10 problems'],econ:['PPC + diagram','Demand & supply shifts','Price mechanism + application'],business:['Functional areas + application','Vision, mission & objectives','Strategy vs tactics'],english:['Analytical paragraph + edit'],turkish:['Reading + 5 notes']};let state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.customEvents=state.customEvents||[];state.eventOverrides=state.eventOverrides||{};state.deletedEvents=state.deletedEvents||{};const save=()=>localStorage.setItem('ib-planner-state',JSON.stringify(state)),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{let p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},monday=d=>{let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function study(ds){if(ds<'2026-10-01'||ds>'2026-12-31')return[];let n=Math.floor((parse(ds)-new Date(2026,9,1,12))/86400000),cycle=[['math','physics'],['math','econ'],['physics','math'],['physics','econ'],['math','business'],['physics','math'],['econ','business'],['math','physics'],['physics','econ'],['math','business'],['physics','math'],['econ','english'],['math','physics'],['business','turkish']],pair=cycle[(n%cycle.length+cycle.length)%cycle.length],out=[];pair.forEach((s,k)=>out.push({id:'study-'+ds+'-'+k,date:ds,title:names[s]+' — '+pools[s][Math.floor(Math.max(n,0)/2)%pools[s].length],start:k?'19:00':'17:00',end:k?'20:00':'18:00',kind:s,source:'plan'}));if(parse(ds).getDay()===6)out.push({id:'eser-'+ds,date:ds,title:'MATH - HL with ESER',start:'10:00',end:'11:30',kind:'math',source:'plan'});if(ds>='2026-11-04'&&ds<='2026-11-11')out.unshift({id:'exam-'+ds,date:ds,title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam',source:'plan'});return out}function kind(t,k){t=(t||'').toLowerCase();if(k==='exam')return'exam';if(t.includes('math'))return'math';if(t.includes('physics'))return'physics';if(t.includes('economics')||t.includes('econ'))return'econ';if(t.includes('business'))return'business';if(t.includes('english'))return'english';if(t.includes('turkish'))return'turkish';return k||'busy'}function events(ds){let a=study(ds).filter(e=>!state.deletedEvents[e.id]).map(e=>Object.assign({},e,state.eventOverrides[e.id]||{}));state.customEvents.filter(e=>e.date===ds).forEach(e=>a.push(Object.assign({},e,{source:'custom'})));a.forEach(e=>e.kind=kind(e.title,e.kind));return a.sort((a,b)=>a.start.localeCompare(b.start))}let cur=new Date(),view=localStorage.getItem('ib-calendar-view')||'month';function bind(){document.querySelectorAll('[data-id]').forEach(x=>x.onclick=e=>{e.stopPropagation();let o=events(x.dataset.date).find(z=>z.id===x.dataset.id);edit(o,x.dataset.date)});document.querySelectorAll('[data-date]').forEach(x=>{if(!x.dataset.id)x.onclick=e=>{if(!e.target.closest('[data-id]'))edit(null,x.dataset.date)}})}function ehtml(e,ds){return'<div class="ev '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'">'+e.start+' '+esc(e.title)+'</div>'}function month(){title.textContent=cur.toLocaleString('en',{month:'long',year:'numeric'});let f=new Date(cur.getFullYear(),cur.getMonth(),1),s=monday(f),h='<div class="month">';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>h+='<div class="dow">'+x+'</div>');for(let i=0;i<42;i++){let d=add(s,i),ds=iso(d);h+='<div class="day '+(d.getMonth()!=cur.getMonth()?'other':'')+'" data-date="'+ds+'"><div class="num">'+d.getDate()+'</div>'+events(ds).slice(0,7).map(e=>ehtml(e,ds)).join('')+'</div>'}cal.innerHTML=h+'</div>';bind()}function pos(e){let a=e.start.split(':').map(Number),b=e.end.split(':').map(Number);return{top:(a[0]*60+a[1])*.75,height:Math.max(24,((b[0]*60+b[1])-(a[0]*60+a[1]))*.75)}}function week(){let s=monday(cur);title.textContent=s.toLocaleDateString('en',{month:'short',day:'numeric'})+' – '+add(s,6).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});let h='<div class="week"><div></div>';for(let i=0;i<7;i++){let d=add(s,i);h+='<div class="wh">'+d.toLocaleDateString('en',{weekday:'short'})+'<br><b>'+d.getDate()+'</b></div>'}h+='<div class="time">';for(let n=0;n<24;n++)h+='<span class="tl" style="top:'+n*45+'px">'+pad(n)+':00</span>';h+='</div>';for(let i=0;i<7;i++){let ds=iso(add(s,i));h+='<div class="lane" data-date="'+ds+'">';events(ds).forEach(e=>{let p=pos(e);h+='<div class="slot '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(e.title)+'</div>'});h+='</div>'}cal.innerHTML=h+'</div>';bind()}function day(){let ds=iso(cur);title.textContent=cur.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'});let h='<div class="dayview"><div class="time">';for(let n=0;n<24;n++)h+='<span class="tl" style="top:'+n*45+'px">'+pad(n)+':00</span>';h+='</div><div class="lane" data-date="'+ds+'">';events(ds).forEach(e=>{let p=pos(e);h+='<div class="slot '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(e.title)+'</div>'});cal.innerHTML=h+'</div></div>';bind()}function year(){title.textContent=cur.getFullYear();let h='<div class="year">';for(let m=0;m<12;m++){let f=new Date(cur.getFullYear(),m,1),s=monday(f);h+='<div class="mini"><b>'+f.toLocaleString('en',{month:'long'})+'</b><div class="mg">';['M','T','W','T','F','S','S'].forEach(x=>h+='<b>'+x+'</b>');for(let i=0;i<42;i++){let d=add(s,i),ds=iso(d);h+='<span class="mc '+(events(ds).length?'has':'')+'" data-jump="'+ds+'">'+d.getDate()+'</span>'}h+='</div></div>'}cal.innerHTML=h+'</div>';document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{cur=parse(x.dataset.jump);view='day';render()})}function render(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));view==='day'?day():view==='week'?week():view==='year'?year():month()}function edit(e,ds){let editing=!!e;modal.innerHTML='<div class="back"><div class="modal"><h2>'+(editing?'Edit event':'New event')+'</h2><div class="field"><label>Title</label><input id="et" value="'+esc(e?.title||'')+'"></div><div class="field"><label>Date</label><input id="ed" type="date" value="'+(e?.date||ds)+'"></div><div class="field"><label>Start</label><input id="es" type="time" value="'+(e?.start||'17:00')+'"></div><div class="field"><label>End</label><input id="ee" type="time" value="'+(e?.end||'18:00')+'"></div><div class="field"><label>Type</label><select id="ek"><option value="math">Math HL</option><option value="physics">Physics HL</option><option value="econ">Economics HL</option><option value="business">Business SL</option><option value="english">English SL</option><option value="turkish">Turkish SL</option><option value="busy">Activity</option><option value="exam">Exam</option></select></div><div class="actions"><div>'+(editing?'<button class="btn danger" id="del">Delete</button>':'')+'</div><div><button class="btn" id="cancel">Cancel</button> <button class="btn on" id="saveEv">Save</button></div></div></div></div>';ek.value=e?.kind||'math';cancel.onclick=()=>modal.innerHTML='';saveEv.onclick=()=>{let o={id:e?.id||'custom-'+Date.now(),date:ed.value,title:et.value.trim(),start:es.value,end:ee.value,kind:ek.value};if(!o.title)return;if(editing&&e.source==='custom'){let i=state.customEvents.findIndex(x=>x.id===e.id);state.customEvents[i]=o}else if(editing)state.eventOverrides[e.id]=o;else state.customEvents.push(o);save();modal.innerHTML='';render()};if(editing)del.onclick=()=>{if(e.source==='custom')state.customEvents=state.customEvents.filter(x=>x.id!==e.id);else state.deletedEvents[e.id]=true;save();modal.innerHTML='';render()}}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;localStorage.setItem('ib-calendar-view',view);render()});today.onclick=()=>{cur=new Date();render()};prev.onclick=()=>{cur=view==='day'?add(cur,-1):view==='week'?add(cur,-7):view==='month'?new Date(cur.getFullYear(),cur.getMonth()-1,1):new Date(cur.getFullYear()-1,0,1);render()};next.onclick=()=>{cur=view==='day'?add(cur,1):view==='week'?add(cur,7):view==='month'?new Date(cur.getFullYear(),cur.getMonth()+1,1):new Date(cur.getFullYear()+1,0,1);render()};addBtn.onclick=()=>edit(null,iso(cur));render();</script></body></html>
