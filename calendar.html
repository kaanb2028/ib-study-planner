<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner — Calendar</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin-bottom:25px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.side a{display:block;color:#d1d5db;text-decoration:none;padding:11px 12px;border-radius:10px;margin:4px 0}.side a:hover,.side a.active{background:#1f2937;color:white}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0;color:var(--muted)}.controls{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.month{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.month h2{font-size:17px;margin:0 0 10px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow div{text-align:center;color:var(--muted);font-size:10px;font-weight:700;padding:3px}.day{min-height:72px;border:1px solid #eef0f5;border-radius:7px;padding:4px;cursor:pointer;overflow:hidden}.day:hover{border-color:#a5b4fc;background:#fafaff}.day.blank{border:0;cursor:default}.day.today{outline:2px solid var(--accent)}.num{font-size:11px;font-weight:700;margin-bottom:3px}.event{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eef2ff;border-left:3px solid var(--accent);border-radius:4px;padding:2px 3px;margin:2px 0;cursor:pointer}.event.gym{background:#ecfeff;border-color:#06b6d4}.event.study{background:#eef2ff;border-color:#4f46e5;color:#312e81}.match{background:#fffbeb;border-color:#f59e0b}.event.busy{background:#f3f4f6;border-color:#111827}.more{font-size:9px;color:var(--muted)}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#475569}.field input,.field select{width:100%;border:1px solid #d9dce5;border-radius:9px;padding:9px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.danger{color:#b42318}.hint{font-size:11px;color:#94a3b8;margin-top:8px}@media(max-width:1100px){.year{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.year{grid-template-columns:1fr}.main{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><a href="index.html">Today</a><a class="active" href="calendar.html">Calendar</a><a href="index.html">Deadlines</a><a href="index.html">Subjects</a><a href="index.html">Classroom</a><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></aside><main class="main"><div class="top"><div><h1>Study Calendar</h1><p>Full-year view. Click any day to add an event; click an event to edit it.</p></div><div class="controls"><button class="btn" id="prev">←</button><strong id="yearLabel"></strong><button class="btn" id="next">→</button><button class="btn primary" id="today">Today</button></div></div><div class="year" id="year"></div></main></div><div id="modalRoot"></div><script>var fixedEvents=[{date:'2026-09-28',title:'Basketball',start:'20:00',end:'21:00',kind:'busy'},{date:'2026-10-02',title:'Basketball Fundamental',start:'16:00',end:'17:00',kind:'busy'},{date:'2026-10-03',title:'Basketball',start:'17:00',end:'18:00',kind:'busy'},{date:'2026-10-04',title:'Padel',start:'20:00',end:'21:00',kind:'busy'},{date:'2026-09-30',title:'Gym',start:'18:00',end:'19:00',kind:'gym'},{date:'2026-10-04',title:'Gym',start:'18:00',end:'19:00',kind:'gym'},{date:'2026-10-02',title:'Fenerbahçe Beko — Match vs Dubai Basketball',start:'20:45',end:'22:45',kind:'match'},{date:'2026-10-04',title:'Fenerbahçe Beko — Match vs Manisa Basket',start:'15:30',end:'17:30',kind:'match'},{date:'2026-10-08',title:'Fenerbahçe Beko — Match at Panathinaikos',start:'21:15',end:'23:15',kind:'match'},{date:'2026-10-10',title:'Fenerbahçe — Football Match at Çaykur Rizespor',start:'19:00',end:'21:00',kind:'match'},{date:'2026-10-10',title:'Fenerbahçe Beko — Match at Çayırova Belediyesi',start:'19:30',end:'21:30',kind:'match'},{date:'2026-10-13',title:'Fenerbahçe Beko — Match vs Zalgiris Kaunas',start:'20:45',end:'22:45',kind:'match'}];var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.customEvents=state.customEvents||[];state.eventOverrides=state.eventOverrides||{};state.deletedEvents=state.deletedEvents||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}function baseId(e,i){return'base-'+e.date+'-'+e.start+'-'+e.title.replace(/[^a-z0-9]/gi,'').slice(0,20)+'-'+i}function studyPlanFor(date){
 if(date<'2026-10-01'||date>'2026-12-31')return[];
 var math=[
  'Functions: domain, range & notation — 6 questions',
  'Quadratics: roots, discriminant & vertex — 8 questions',
  'Graph transformations — 6 questions',
  'Polynomials: factor & remainder theorem — 6 questions',
  'Sequences & series — 8 questions',
  'Exponents & logarithms — 8 questions',
  'Mixed Algebra — 35-min timed set'
 ];
 var physics=[
  'Kinematics: distance, displacement, speed & velocity',
  'Motion graphs: gradients & areas — 5 questions',
  'SUVAT: choose the right equation — 6 problems',
  'SUVAT: mixed exam-style problems — 5 questions',
  'Relative motion — review + 4 questions',
  'Kinematics mixed review — timed set'
 ];
 var econ=[
  'Scarcity, choice & opportunity cost + PPC',
  'Demand: movements vs shifts + 2 diagrams',
  'Supply: movements vs shifts + 2 diagrams',
  'Market equilibrium: shortage, surplus & adjustment',
  'Price mechanism: signals, incentives & allocation',
  'Consumer & producer surplus — diagrams + calculations',
  'Allocative efficiency: MB = MC + 2 exam questions'
 ];
 var business=[
  'What is a business? Inputs, processes & outputs',
  'Functional areas + one application question',
  'Sectors of industry + added value',
  'Business entities: sole trader, partnership, companies',
  'Vision vs mission — compare + examples',
  'Business objectives: growth, profit, ethics',
  'Strategic vs tactical objectives + 2 case questions',
  'CSR — review + one application question'
 ];
 var english=['Writing: one full paragraph + edit for clarity','Writing: thesis/topic sentence + evidence','Writing: 30-min response + self-edit'];
 var turkish=['Deneme: outline + one paragraph','Deneme: revise structure and expression','Şeyh Bedrettin / Turkish reading: 20 min + 5 notes'];
 var d=new Date(date+'T12:00:00'), start=new Date('2026-10-01T12:00:00'), n=Math.floor((d-start)/86400000), dow=d.getDay();
 function ev(k,title,start,end,subject){return{id:'study-'+date+'-'+k,date:date,title:title,start:start,end:end,kind:'study',source:'studyplan',subject:subject}}
 // deadline-heavy opening days
 var special={
  '2026-10-01':[ev('a','Turkish — Portfolio: final proofread + upload-ready check','17:00','17:40','turkish'),ev('b','Math HL — Algebra quiz prep: 8 questions + redo errors','19:00','19:45','math')],
  '2026-10-02':[ev('a','Math HL — Algebra: quadratics + functions mixed practice','17:00','17:45','math'),ev('b','Physics HL — Kinematics: motion graphs + SUVAT','19:00','19:45','physics')],
  '2026-10-03':[ev('a','Economics HL — Price Mechanism: definitions + 2 diagrams','11:00','11:45','econ'),ev('b','Physics HL — Kinematics: 5 exam-style questions','15:00','15:45','physics')],
  '2026-10-04':[ev('a','Math HL — Final quiz review: weak questions only','11:00','11:45','math'),ev('b','Turkish — Şeyh Bedrettin: reading + 5 bullet notes','13:00','13:40','turkish')],
  '2026-10-05':[ev('a','Economics HL — Quiz prep: equilibrium + price mechanism','17:00','17:45','econ'),ev('b','Physics HL — Quiz prep: SUVAT + graphs','19:00','19:45','physics')],
  '2026-10-06':[ev('a','Physics HL — Lab: calculations, graph & findings final check','17:00','17:50','physics'),ev('b','Business SL — Vision, mission, strategy & tactics review','19:00','19:40','business')]
 };
 if(special[date])return special[date];

 // phases: Oct consolidation, Nov application, Dec cumulative/timed revision
 var phase=date<'2026-11-01'?'CONSOLIDATE':date<'2026-12-01'?'APPLY':'REVISE';
 var pairs=[['math','physics'],['econ','business'],['math','econ'],['physics','business'],['math','business'],['physics','econ']];
 var pair=pairs[n%pairs.length], out=[];
 function pick(subjName){
  var arr=subjName==='math'?math:subjName==='physics'?physics:subjName==='econ'?econ:business;
  var t=arr[Math.floor(n/2)%arr.length];
  if(phase==='APPLY')t+=' — finish with 1 IB-style application/exam question';
  if(phase==='REVISE')t+=' — timed + correct every error';
  return (subjName==='math'?'Math AA HL':subjName==='physics'?'Physics HL':subjName==='econ'?'Economics HL':'Business SL')+' — '+t;
 }
 out.push(ev('a',pick(pair[0]),'17:00','17:45',pair[0]));
 out.push(ev('b',pick(pair[1]),'19:00','19:45',pair[1]));
 // light language block on weekends
 if(dow===0)out.push(ev('c','English SL — '+english[n%english.length],'20:00','20:30','english'));
 if(dow===6)out.push(ev('c','Turkish SL — '+turkish[n%turkish.length],'20:00','20:30','turkish'));
 return out;
}
function dayEvents(date){
 var a=fixedEvents.filter(function(e){return e.date===date}).map(function(e,i){return Object.assign({},e,{id:baseId(e,i),source:'base'})});
 studyPlanFor(date).forEach(function(e){a.push(e)});
 a=a.filter(function(e){return!state.deletedEvents[e.id]}).map(function(e){return Object.assign({},e,state.eventOverrides[e.id]||{})});
 state.customEvents.filter(function(e){return e.date===date}).forEach(function(e){a.push(Object.assign({},e,{source:'custom'}))});
 return a.sort(function(a,b){return a.start.localeCompare(b.start)})
}var viewYear=new Date().getFullYear();function render(){yearLabel.textContent=viewYear;var out='',names=['January','February','March','April','May','June','July','August','September','October','November','December'],today=new Date(),todayIso=iso(today.getFullYear(),today.getMonth(),today.getDate());for(var m=0;m<12;m++){var first=new Date(viewYear,m,1),days=new Date(viewYear,m+1,0).getDate(),offset=(first.getDay()+6)%7;out+='<section class="month"><h2>'+names[m]+'</h2><div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="days">';for(var b=0;b<offset;b++)out+='<div class="day blank"></div>';for(var d=1;d<=days;d++){var date=iso(viewYear,m,d),ev=dayEvents(date);out+='<div class="day '+(date===todayIso?'today':'')+'" data-date="'+date+'"><div class="num">'+d+'</div>'+ev.slice(0,5).map(function(e){return'<div class="event '+esc(e.kind)+'" data-id="'+esc(e.id)+'" data-date="'+date+'">'+esc(e.start)+' '+esc(e.title)+'</div>'}).join('')+(ev.length>5?'<div class="more">+'+(ev.length-5)+' more</div>':'')+'</div>'}out+='</div></section>'}year.innerHTML=out;document.querySelectorAll('.day[data-date]').forEach(function(x){x.onclick=function(e){if(!e.target.classList.contains('event'))openModal(null,x.dataset.date)}});document.querySelectorAll('.event').forEach(function(x){x.onclick=function(e){e.stopPropagation();var ev=dayEvents(x.dataset.date).find(function(z){return z.id===x.dataset.id});if(ev)openModal(ev,x.dataset.date)}})}function openModal(e,date){var editing=!!e,id=e&&e.id||'',src=e&&e.source||'custom';modalRoot.innerHTML='<div class="modalBack" id="back"><div class="modal"><h2>'+(editing?'Edit event':'Add event')+'</h2><div class="field"><label>Title</label><input id="title" value="'+esc(e&&e.title||'')+'"></div><div class="field"><label>Date</label><input id="date" type="date" value="'+esc(e&&e.date||date)+'"></div><div class="field"><label>Start</label><input id="start" type="time" value="'+esc(e&&e.start||'17:00')+'"></div><div class="field"><label>End</label><input id="end" type="time" value="'+esc(e&&e.end||'18:00')+'"></div><div class="field"><label>Type</label><select id="kind"><option value="busy">Activity / Lesson</option><option value="gym">Gym / Sport</option><option value="match">Match / Event</option><option value="study">Study</option></select></div><div class="hint">Saved on this device.</div><div class="actions"><div>'+(editing?'<button class="btn danger" id="del">Delete</button>':'')+'</div><div><button class="btn" id="cancel">Cancel</button> <button class="btn primary" id="saveEv">Save</button></div></div></div></div>';kind.value=e&&e.kind||'busy';cancel.onclick=close;back.onclick=function(x){if(x.target===back)close()};saveEv.onclick=function(){var o={id:id||'custom-'+Date.now(),date:document.getElementById('date').value,title:title.value.trim(),start:start.value,end:end.value,kind:kind.value};if(!o.title||!o.date||!o.start||!o.end)return alert('Fill all fields.');if(editing&&src==='custom'){var i=state.customEvents.findIndex(function(x){return x.id===id});if(i>=0)state.customEvents[i]=o}else if(editing)state.eventOverrides[id]=o;else state.customEvents.push(o);save();close();render()};if(editing)del.onclick=function(){if(src==='custom')state.customEvents=state.customEvents.filter(function(x){return x.id!==id});else state.deletedEvents[id]=true;save();close();render()}}function close(){modalRoot.innerHTML=''}prev.onclick=function(){viewYear--;render()};next.onclick=function(){viewYear++;render()};today.onclick=function(){viewYear=new Date().getFullYear();render()};render();</script></body></html>
