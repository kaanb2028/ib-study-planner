<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner — Calendar</title><style>:root{--bg:#fff;--ink:#202124;--muted:#70757a;--line:#e0e3e7;--accent:#4f46e5;--study:#e8e7ff;--busy:#dff5f7;--match:#fff1c7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 14px;background:#fafafa;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin:0 8px 22px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.side a{display:block;text-decoration:none;color:#374151;padding:10px 12px;border-radius:10px;margin:3px}.side a.active{background:#eef2ff;color:#3730a3;font-weight:700}.main{min-width:0}.toolbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--line);gap:12px;position:sticky;top:0;background:#fff;z-index:4}.nav,.views{display:flex;align-items:center;gap:7px}.title{font-size:27px;font-weight:700;min-width:190px}.btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;cursor:pointer}.btn.icon{border-radius:50%;width:36px;height:36px;padding:0}.btn.active{background:#eef0f3;font-weight:700}.calendar{height:calc(100vh - 72px);overflow:auto}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);min-width:900px}.weekday{height:30px;text-align:center;padding:6px;color:var(--muted);border-bottom:1px solid var(--line)}.mday{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;overflow:hidden}.mday.other{background:#fafafa;color:#aaa}.dateNum{text-align:right;font-size:13px;padding:2px 4px}.dateNum.today{background:var(--accent);color:#fff;border-radius:50%;width:25px;height:25px;line-height:21px;margin-left:auto;text-align:center}.event{font-size:11px;padding:3px 5px;border-radius:5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--accent);background:var(--study)}.event.busy,.event.gym{background:var(--busy);border-color:#22b8c7}.event.match{background:var(--match);border-color:#e6a700}.weekGrid{display:grid;grid-template-columns:64px repeat(7,1fr);min-width:950px}.weekHead{height:54px;text-align:center;border-bottom:1px solid var(--line);padding:7px}.timeCol,.dayCol{position:relative;height:1080px;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 44px,#eceff3 45px)}.timeLabel{position:absolute;right:7px;color:#888;font-size:10px;transform:translateY(-6px)}.slotEvent{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px;font-size:11px;overflow:hidden;background:var(--study);border-left:4px solid var(--accent);cursor:pointer}.slotEvent.busy,.slotEvent.gym{background:var(--busy);border-color:#22b8c7}.slotEvent.match{background:var(--match);border-color:#e6a700}.dayView{display:grid;grid-template-columns:70px 1fr;max-width:900px;margin:auto}.dayLane{position:relative;height:1080px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 44px,#eceff3 45px);border-left:1px solid var(--line);border-right:1px solid var(--line)}.yearView{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:20px}.miniMonth{border:1px solid var(--line);border-radius:12px;padding:12px}.miniMonth h3{margin:0 0 8px}.miniGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.miniCell{text-align:center;font-size:10px;padding:5px 2px;border-radius:5px;cursor:pointer}.miniCell.has{background:#eef2ff}.miniCell.today{background:var(--accent);color:#fff}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}.modal{background:#fff;border-radius:18px;padding:20px;width:min(460px,92vw);box-shadow:0 20px 60px #0004}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #d5d8de;border-radius:9px}.actions{display:flex;justify-content:space-between;margin-top:16px}.danger{color:#b42318}.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:27px;box-shadow:0 6px 20px #0003;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.toolbar{padding:8px}.title{font-size:20px;min-width:auto}.yearView{grid-template-columns:1fr 1fr}.views .btn{padding:6px 8px}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><a href="index.html">Today</a><a class="active" href="calendar.html">Calendar</a><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></aside><main class="main"><div class="toolbar"><div class="nav"><button class="btn" id="todayBtn">Today</button><button class="btn icon" id="prev">‹</button><button class="btn icon" id="next">›</button><div class="title" id="title"></div></div><div class="views"><button class="btn" data-view="day">Day</button><button class="btn" data-view="week">Week</button><button class="btn" data-view="month">Month</button><button class="btn" data-view="year">Year</button></div></div><div class="calendar" id="cal"></div></main></div><button class="fab" id="add">+</button><div id="modalRoot"></div><script>
var fixedEvents=[{date:'2026-10-02',title:'Basketball Fundamental',start:'16:00',end:'17:00',kind:'busy'},{date:'2026-10-03',title:'Basketball',start:'17:00',end:'18:00',kind:'busy'},{date:'2026-10-04',title:'Padel',start:'20:00',end:'21:00',kind:'busy'},{date:'2026-10-04',title:'Gym',start:'18:00',end:'19:00',kind:'gym'},{date:'2026-10-02',title:'Fenerbahçe Beko — Match vs Dubai Basketball',start:'20:45',end:'22:45',kind:'match'},{date:'2026-10-04',title:'Fenerbahçe Beko — Match vs Manisa Basket',start:'15:30',end:'17:30',kind:'match'},{date:'2026-10-08',title:'Fenerbahçe Beko — Match at Panathinaikos',start:'21:15',end:'23:15',kind:'match'}];
var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.customEvents=state.customEvents||[];state.eventOverrides=state.eventOverrides||{};state.deletedEvents=state.deletedEvents||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function baseId(e,i){return'base-'+e.date+'-'+e.start+'-'+i}function studyPlanFor(date){if(date<'2026-10-01'||date>'2026-12-31')return[];var math=['Functions: domain, range & notation — 6 questions','Quadratics: roots, discriminant & vertex — 8 questions','Graph transformations — 6 questions','Polynomials: factor & remainder theorem — 6 questions','Sequences & series — 8 questions','Exponents & logarithms — 8 questions','Mixed Algebra — timed set'];var physics=['Kinematics: distance, displacement, speed & velocity','Motion graphs: gradients & areas — 5 questions','SUVAT — 6 problems','SUVAT mixed exam-style — 5 questions','Relative motion — 4 questions','Kinematics timed review'];var econ=['Scarcity, choice & opportunity cost + PPC','Demand: shifts + 2 diagrams','Supply: shifts + 2 diagrams','Market equilibrium: shortage & surplus','Price mechanism: signals & incentives','Consumer & producer surplus','Allocative efficiency: MB = MC'];var business=['Inputs, processes & outputs','Functional areas + application','Sectors + added value','Business entities comparison','Vision vs mission','Business objectives','Strategic vs tactical objectives','CSR + application'];var start=new Date(2026,9,1,12),d=parse(date),n=Math.floor((d-start)/86400000),pairs=[['math','physics'],['econ','business'],['math','econ'],['physics','business'],['math','business'],['physics','econ']],pair=pairs[((n%pairs.length)+pairs.length)%pairs.length],pools={math:math,physics:physics,econ:econ,business:business},names={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL'};return pair.map(function(s,k){return{id:'study-'+date+'-'+k,date:date,title:names[s]+' — '+pools[s][Math.floor(Math.max(n,0)/2)%pools[s].length],start:k?'19:00':'17:00',end:k?'19:45':'17:45',kind:'study',source:'studyplan'}})}function events(date){var a=fixedEvents.filter(e=>e.date===date).map((e,i)=>Object.assign({},e,{id:baseId(e,i),source:'base'}));studyPlanFor(date).forEach(e=>a.push(e));a=a.filter(e=>!state.deletedEvents[e.id]).map(e=>Object.assign({},e,state.eventOverrides[e.id]||{}));state.customEvents.filter(e=>e.date===date).forEach(e=>a.push(Object.assign({},e,{source:'custom'})));return a.sort((a,b)=>a.start.localeCompare(b.start))}
var cursor=new Date(),view=localStorage.getItem('ib-calendar-view')||'month';function setView(v){view=v;localStorage.setItem('ib-calendar-view',v);render()}function monthName(d){return d.toLocaleString('en',{month:'long',year:'numeric'})}function weekStart(d){var x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}function evHtml(e,date,cls){return'<div class="'+(cls||'event')+' '+esc(e.kind)+'" data-id="'+esc(e.id)+'" data-date="'+date+'">'+esc(e.start)+' '+esc(e.title)+'</div>'}function bind(){document.querySelectorAll('[data-id]').forEach(x=>x.onclick=function(ev){ev.stopPropagation();var e=events(x.dataset.date).find(z=>z.id===x.dataset.id);if(e)openModal(e,x.dataset.date)});document.querySelectorAll('[data-date].clickday').forEach(x=>x.onclick=function(ev){if(!ev.target.closest('[data-id]'))openModal(null,x.dataset.date)})}
function renderMonth(){title.textContent=monthName(cursor);var first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=weekStart(first),today=iso(new Date()),out='<div class="monthGrid">';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>out+='<div class="weekday">'+x+'</div>');for(var i=0;i<42;i++){var d=addDays(start,i),ds=iso(d),other=d.getMonth()!==cursor.getMonth(),es=events(ds);out+='<div class="mday clickday '+(other?'other':'')+'" data-date="'+ds+'"><div class="dateNum '+(ds===today?'today':'')+'">'+d.getDate()+'</div>'+es.slice(0,5).map(e=>evHtml(e,ds)).join('')+(es.length>5?'<div class="event">+'+(es.length-5)+' more</div>':'')+'</div>'}cal.innerHTML=out+'</div>';bind()}
function position(e){var h=+e.start.slice(0,2),m=+e.start.slice(3,5),eh=+e.end.slice(0,2),em=+e.end.slice(3,5);return{top:(h*60+m)*.75,height:Math.max(24,((eh*60+em)-(h*60+m))*.75)}}function renderWeek(){var s=weekStart(cursor),e=addDays(s,6);title.textContent=s.toLocaleDateString('en',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});var out='<div class="weekGrid"><div></div>';for(var i=0;i<7;i++){var d=addDays(s,i);out+='<div class="weekHead">'+d.toLocaleDateString('en',{weekday:'short'})+'<br><b>'+d.getDate()+'</b></div>'}out+='<div class="timeCol">';for(var h=0;h<24;h++)out+='<div class="timeLabel" style="top:'+(h*45)+'px">'+pad(h)+':00</div>';out+='</div>';for(var i=0;i<7;i++){var d=addDays(s,i),ds=iso(d);out+='<div class="dayCol clickday" data-date="'+ds+'">';events(ds).forEach(function(ev){var p=position(ev);out+='<div class="slotEvent '+esc(ev.kind)+'" data-id="'+esc(ev.id)+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(ev.start)+' '+esc(ev.title)+'</div>'});out+='</div>'}cal.innerHTML=out+'</div>';bind()}
function renderDay(){var ds=iso(cursor);title.textContent=cursor.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'});var out='<div class="dayView"><div class="timeCol">';for(var h=0;h<24;h++)out+='<div class="timeLabel" style="top:'+(h*45)+'px">'+pad(h)+':00</div>';out+='</div><div class="dayLane clickday" data-date="'+ds+'">';events(ds).forEach(function(ev){var p=position(ev);out+='<div class="slotEvent '+esc(ev.kind)+'" data-id="'+esc(ev.id)+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(ev.start)+'–'+esc(ev.end)+' '+esc(ev.title)+'</div>'});cal.innerHTML=out+'</div></div>';bind()}
function renderYear(){title.textContent=cursor.getFullYear();var names=['January','February','March','April','May','June','July','August','September','October','November','December'],today=iso(new Date()),out='<div class="yearView">';for(var m=0;m<12;m++){var first=new Date(cursor.getFullYear(),m,1),start=weekStart(first);out+='<div class="miniMonth"><h3>'+names[m]+'</h3><div class="miniGrid">';['M','T','W','T','F','S','S'].forEach(x=>out+='<b class="miniCell">'+x+'</b>');for(var i=0;i<42;i++){var d=addDays(start,i),ds=iso(d),same=d.getMonth()===m;out+='<div class="miniCell '+(events(ds).length?'has ':'')+(ds===today?'today':'')+'" data-jump="'+ds+'" style="opacity:'+(same?1:.25)+'">'+d.getDate()+'</div>'}out+='</div></div>'}cal.innerHTML=out+'</div>';document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=function(){cursor=parse(x.dataset.jump);setView('day')})}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='day')renderDay();else if(view==='week')renderWeek();else if(view==='year')renderYear();else renderMonth()}
function openModal(e,date){var editing=!!e,id=e&&e.id||'',src=e&&e.source||'custom';modalRoot.innerHTML='<div class="modalBack" id="back"><div class="modal"><h2>'+(editing?'Edit event':'New event')+'</h2><div class="field"><label>Title</label><input id="evTitle" value="'+esc(e&&e.title||'')+'"></div><div class="field"><label>Date</label><input id="evDate" type="date" value="'+esc(e&&e.date||date)+'"></div><div class="field"><label>Start</label><input id="evStart" type="time" value="'+esc(e&&e.start||'17:00')+'"></div><div class="field"><label>End</label><input id="evEnd" type="time" value="'+esc(e&&e.end||'18:00')+'"></div><div class="field"><label>Type</label><select id="evKind"><option value="study">Study</option><option value="busy">Lesson / Activity</option><option value="gym">Sport</option><option value="match">Match / Event</option></select></div><div class="actions"><div>'+(editing?'<button class="btn danger" id="del">Delete</button>':'')+'</div><div><button class="btn" id="cancel">Cancel</button> <button class="btn active" id="saveEv">Save</button></div></div></div></div>';evKind.value=e&&e.kind||'study';cancel.onclick=close;back.onclick=x=>{if(x.target===back)close()};saveEv.onclick=function(){var o={id:id||'custom-'+Date.now(),date:evDate.value,title:evTitle.value.trim(),start:evStart.value,end:evEnd.value,kind:evKind.value};if(!o.title||!o.date||!o.start||!o.end)return alert('Fill all fields.');if(editing&&src==='custom'){var ix=state.customEvents.findIndex(x=>x.id===id);if(ix>=0)state.customEvents[ix]=o}else if(editing)state.eventOverrides[id]=o;else state.customEvents.push(o);save();close();render()};if(editing)del.onclick=function(){if(src==='custom')state.customEvents=state.customEvents.filter(x=>x.id!==id);else state.deletedEvents[id]=true;save();close();render()}}function close(){modalRoot.innerHTML=''}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));todayBtn.onclick=function(){cursor=new Date();render()};prev.onclick=function(){if(view==='day')cursor=addDays(cursor,-1);else if(view==='week')cursor=addDays(cursor,-7);else if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else cursor=new Date(cursor.getFullYear()-1,0,1);render()};next.onclick=function(){if(view==='day')cursor=addDays(cursor,1);else if(view==='week')cursor=addDays(cursor,7);else if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else cursor=new Date(cursor.getFullYear()+1,0,1);render()};add.onclick=function(){openModal(null,iso(cursor))};render();</script></body></html>
