<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner — Calendar</title><style>:root{--line:#e1e5eb;--ink:#182235;--muted:#697386;--math:#7c3aed;--physics:#2878e8;--econ:#079669;--business:#d97706;--english:#db2777;--turkish:#dc2626;--sport:#12b8c8;--exam:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 18px;background:#fafafa}.brand{font-size:20px;font-weight:800;margin:0 6px 24px}.brand small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.side a{display:block;text-decoration:none;color:#374151;padding:10px 12px;border-radius:10px;margin:3px 0}.side a.active{background:#eef2ff;color:#3730a3;font-weight:700}.main{min-width:0}.toolbar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--line);gap:12px}.nav,.views{display:flex;align-items:center;gap:8px}.title{font-size:28px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;cursor:pointer}.btn.active{background:#eef0f3;font-weight:700}.icon{width:38px;height:38px;padding:0;border-radius:50%}.calendar{height:calc(100vh - 78px);overflow:auto}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);min-width:950px}.weekday{text-align:center;padding:7px;color:var(--muted);border-bottom:1px solid var(--line)}.mday{min-height:145px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer}.mday.other{background:#fafafa;color:#aaa}.dateNum{text-align:right;font-size:13px;padding:2px 4px}.dateNum.today{background:#4f46e5;color:#fff;border-radius:50%;width:26px;height:26px;line-height:22px;margin-left:auto;text-align:center}.event{font-size:11px;padding:4px 5px;border-radius:5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:4px solid #6b7280;background:#f3f4f6}.math{background:#f0eaff!important;border-color:var(--math)!important}.physics{background:#e9f2ff!important;border-color:var(--physics)!important}.econ{background:#e5f8f0!important;border-color:var(--econ)!important}.business{background:#fff1df!important;border-color:var(--business)!important}.english{background:#fce7f3!important;border-color:var(--english)!important}.turkish{background:#feeaea!important;border-color:var(--turkish)!important}.busy,.gym{background:#e2f8fa!important;border-color:var(--sport)!important}.exam{background:#fee2e2!important;border-color:var(--exam)!important;font-weight:800}.weekGrid{display:grid;grid-template-columns:64px repeat(7,1fr);min-width:980px}.weekHead{text-align:center;height:55px;padding:7px;border-bottom:1px solid var(--line)}.timeCol,.dayCol{position:relative;height:1080px;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 44px,#edf0f4 45px)}.timeLabel{position:absolute;right:7px;color:#888;font-size:10px;transform:translateY(-6px)}.slotEvent{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px;font-size:11px;overflow:hidden;border-left:4px solid #6b7280;background:#f3f4f6;cursor:pointer}.dayView{display:grid;grid-template-columns:70px 1fr;max-width:1000px;margin:auto}.dayLane{position:relative;height:1080px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 44px,#edf0f4 45px)}.yearView{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:20px}.miniMonth{border:1px solid var(--line);border-radius:12px;padding:12px}.miniGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.miniCell{text-align:center;font-size:10px;padding:5px 2px;border-radius:5px}.miniCell.has{background:#eef2ff}.modalBack{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:20}.modal{background:#fff;border-radius:18px;padding:20px;width:min(460px,92vw)}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #d5d8de;border-radius:9px}.actions{display:flex;justify-content:space-between;margin-top:16px}.danger{color:#b42318}.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border:0;border-radius:50%;background:#4f46e5;color:#fff;font-size:27px;box-shadow:0 6px 20px #0003}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.toolbar{padding:8px}.title{font-size:20px}.yearView{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><a href="index.html">Today</a><a class="active" href="calendar.html">Calendar</a><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></aside><main class="main"><div class="toolbar"><div class="nav"><button class="btn" id="todayBtn">Today</button><button class="btn icon" id="prev">‹</button><button class="btn icon" id="next">›</button><div class="title" id="title"></div></div><div class="views"><button class="btn" data-view="day">Day</button><button class="btn" data-view="week">Week</button><button class="btn" data-view="month">Month</button><button class="btn" data-view="year">Year</button></div></div><div class="calendar" id="cal"></div></main></div><button class="fab" id="add">+</button><div id="modalRoot"></div><script>
var fixedEvents=[{date:'2026-11-04',title:'EXAM WEEK — 4–11 November',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-05',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-06',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-07',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-08',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-09',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-10',title:'EXAM WEEK',start:'08:00',end:'08:30',kind:'exam'},{date:'2026-11-11',title:'EXAM WEEK — Final day',start:'08:00',end:'08:30',kind:'exam'}];
var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.customEvents=state.customEvents||[];state.eventOverrides=state.eventOverrides||{};state.deletedEvents=state.deletedEvents||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}function weekStart(d){var x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
var pools={math:['Functions & graphs — 8 IB questions','Quadratics & discriminant — 10 questions','Graph transformations — 8 questions','Polynomials — 8 exam questions','Sequences & series — 10 questions','Exponents & logarithms — 10 questions','Mixed Algebra — 50 min timed set'],physics:['Kinematics concepts + 8 questions','Motion graphs — 8 questions','SUVAT — 10 problems','Mixed kinematics — 8 IB questions','Relative motion — 6 questions','Data/graph skills — 45 min timed set'],econ:['Scarcity, choice & PPC + diagram','Demand & supply shifts + 4 diagrams','Equilibrium, shortage & surplus','Price mechanism + application','Consumer/producer surplus + calculations','Allocative efficiency + IB response'],business:['Inputs, processes & outputs + case','Functional areas + application','Sectors & added value','Business entities comparison','Vision, mission & objectives','Strategy vs tactics + case','CSR + application'],english:['Write one analytical paragraph + edit','30 min writing response','Vocabulary + one paragraph'],turkish:['30 min reading + 5 notes','One paragraph + revision','Deneme outline + paragraph']},names={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL'};
function studyPlanFor(date){if(date<'2026-10-01'||date>'2026-12-31')return[];var n=Math.floor((parse(date)-new Date(2026,9,1,12))/86400000),cycle=[['math','physics'],['math','econ'],['physics','math'],['physics','econ'],['math','business'],['physics','math'],['econ','business'],['math','physics'],['physics','econ'],['math','business'],['physics','math'],['econ','english'],['math','physics'],['business','turkish']],pair=cycle[((n%cycle.length)+cycle.length)%cycle.length],exam=date>='2026-10-25'&&date<='2026-11-11',out=[];pair.forEach(function(s,k){var topic=pools[s][Math.floor(Math.max(n,0)/2)%pools[s].length];if(exam)topic+=' — EXAM PREP: timed + correct mistakes';out.push({id:'study-'+date+'-'+k,date:date,title:names[s]+' — '+topic,start:k?'19:00':'17:00',end:k?'20:00':'18:00',kind:s,source:'studyplan'})});if(exam&&(pair.indexOf('math')<0||pair.indexOf('physics')<0)){var s=pair.indexOf('math')<0?'math':'physics';out.push({id:'study-'+date+'-extra',date:date,title:names[s]+' — Exam-week priority review',start:'20:15',end:'21:00',kind:s,source:'studyplan'})}return out}
function subjectKind(title,kind){var t=(title||'').toLowerCase();if(kind==='exam')return'exam';if(t.includes('math'))return'math';if(t.includes('physics'))return'physics';if(t.includes('economics')||t.includes('econ'))return'econ';if(t.includes('business'))return'business';if(t.includes('english'))return'english';if(t.includes('turkish'))return'turkish';return kind||'study'}function events(date){var a=fixedEvents.filter(e=>e.date===date).map((e,i)=>Object.assign({},e,{id:'base-'+e.date+'-'+i,source:'base'}));studyPlanFor(date).forEach(e=>a.push(e));a=a.filter(e=>!state.deletedEvents[e.id]).map(e=>Object.assign({},e,state.eventOverrides[e.id]||{}));state.customEvents.filter(e=>e.date===date).forEach(e=>a.push(Object.assign({},e,{source:'custom'})));a.forEach(e=>e.kind=subjectKind(e.title,e.kind));return a.sort((a,b)=>a.start.localeCompare(b.start))}
var cursor=new Date(),view=localStorage.getItem('ib-calendar-view')||'month';function evHtml(e,ds){return'<div class="event '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'">'+esc(e.start)+' '+esc(e.title)+'</div>'}function bind(){document.querySelectorAll('[data-id]').forEach(x=>x.onclick=function(ev){ev.stopPropagation();var e=events(x.dataset.date).find(z=>z.id===x.dataset.id);if(e)openModal(e,x.dataset.date)});document.querySelectorAll('.clickday').forEach(x=>x.onclick=function(ev){if(!ev.target.closest('[data-id]'))openModal(null,x.dataset.date)})}function renderMonth(){title.textContent=cursor.toLocaleString('en',{month:'long',year:'numeric'});var f=new Date(cursor.getFullYear(),cursor.getMonth(),1),s=weekStart(f),today=iso(new Date()),out='<div class="monthGrid">';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>out+='<div class="weekday">'+x+'</div>');for(var i=0;i<42;i++){var d=addDays(s,i),ds=iso(d),es=events(ds);out+='<div class="mday clickday '+(d.getMonth()!=cursor.getMonth()?'other':'')+'" data-date="'+ds+'"><div class="dateNum '+(ds===today?'today':'')+'">'+d.getDate()+'</div>'+es.slice(0,6).map(e=>evHtml(e,ds)).join('')+'</div>'}cal.innerHTML=out+'</div>';bind()}function pos(e){var a=e.start.split(':').map(Number),b=e.end.split(':').map(Number);return{top:(a[0]*60+a[1])*.75,height:Math.max(24,((b[0]*60+b[1])-(a[0]*60+a[1]))*.75)}}function renderWeek(){var s=weekStart(cursor),e=addDays(s,6);title.textContent=s.toLocaleDateString('en',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});var out='<div class="weekGrid"><div></div>';for(var i=0;i<7;i++){var d=addDays(s,i);out+='<div class="weekHead">'+d.toLocaleDateString('en',{weekday:'short'})+'<br><b>'+d.getDate()+'</b></div>'}out+='<div class="timeCol">';for(var h=0;h<24;h++)out+='<div class="timeLabel" style="top:'+h*45+'px">'+pad(h)+':00</div>';out+='</div>';for(var i=0;i<7;i++){var ds=iso(addDays(s,i));out+='<div class="dayCol clickday" data-date="'+ds+'">';events(ds).forEach(e=>{var p=pos(e);out+='<div class="slotEvent '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(e.title)+'</div>'});out+='</div>'}cal.innerHTML=out+'</div>';bind()}function renderDay(){var ds=iso(cursor);title.textContent=cursor.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'});var out='<div class="dayView"><div class="timeCol">';for(var h=0;h<24;h++)out+='<div class="timeLabel" style="top:'+h*45+'px">'+pad(h)+':00</div>';out+='</div><div class="dayLane clickday" data-date="'+ds+'">';events(ds).forEach(e=>{var p=pos(e);out+='<div class="slotEvent '+e.kind+'" data-id="'+e.id+'" data-date="'+ds+'" style="top:'+p.top+'px;height:'+p.height+'px">'+esc(e.title)+'</div>'});cal.innerHTML=out+'</div></div>';bind()}function renderYear(){title.textContent=cursor.getFullYear();var out='<div class="yearView">';for(var m=0;m<12;m++){var f=new Date(cursor.getFullYear(),m,1),s=weekStart(f);out+='<div class="miniMonth"><h3>'+f.toLocaleString('en',{month:'long'})+'</h3><div class="miniGrid">';['M','T','W','T','F','S','S'].forEach(x=>out+='<b class="miniCell">'+x+'</b>');for(var i=0;i<42;i++){var d=addDays(s,i),ds=iso(d);out+='<div class="miniCell '+(events(ds).length?'has':'')+'" data-jump="'+ds+'">'+d.getDate()+'</div>'}out+='</div></div>'}cal.innerHTML=out+'</div>';document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{cursor=parse(x.dataset.jump);view='day';render()})}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));view==='day'?renderDay():view==='week'?renderWeek():view==='year'?renderYear():renderMonth()}
function openModal(e,date){var editing=!!e,id=e&&e.id||'',src=e&&e.source||'custom';modalRoot.innerHTML='<div class="modalBack" id="back"><div class="modal"><h2>'+(editing?'Edit event':'New event')+'</h2><div class="field"><label>Title</label><input id="evTitle" value="'+esc(e&&e.title||'')+'"></div><div class="field"><label>Date</label><input id="evDate" type="date" value="'+esc(e&&e.date||date)+'"></div><div class="field"><label>Start</label><input id="evStart" type="time" value="'+esc(e&&e.start||'17:00')+'"></div><div class="field"><label>End</label><input id="evEnd" type="time" value="'+esc(e&&e.end||'18:00')+'"></div><div class="field"><label>Subject / type</label><select id="evKind"><option value="math">Math HL</option><option value="physics">Physics HL</option><option value="econ">Economics HL</option><option value="business">Business SL</option><option value="english">English SL</option><option value="turkish">Turkish SL</option><option value="busy">Activity</option><option value="exam">Exam</option></select></div><div class="actions"><div>'+(editing?'<button class="btn danger" id="del">Delete</button>':'')+'</div><div><button class="btn" id="cancel">Cancel</button> <button class="btn active" id="saveEv">Save</button></div></div></div></div>';evKind.value=e&&e.kind||'math';cancel.onclick=close;back.onclick=x=>{if(x.target===back)close()};saveEv.onclick=function(){var o={id:id||'custom-'+Date.now(),date:evDate.value,title:evTitle.value.trim(),start:evStart.value,end:evEnd.value,kind:evKind.value};if(!o.title)return;if(editing&&src==='custom'){var ix=state.customEvents.findIndex(x=>x.id===id);if(ix>=0)state.customEvents[ix]=o}else if(editing)state.eventOverrides[id]=o;else state.customEvents.push(o);save();close();render()};if(editing)del.onclick=function(){if(src==='custom')state.customEvents=state.customEvents.filter(x=>x.id!==id);else state.deletedEvents[id]=true;save();close();render()}}function close(){modalRoot.innerHTML=''}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;localStorage.setItem('ib-calendar-view',view);render()});todayBtn.onclick=()=>{cursor=new Date();render()};prev.onclick=()=>{cursor=view==='day'?addDays(cursor,-1):view==='week'?addDays(cursor,-7):view==='month'?new Date(cursor.getFullYear(),cursor.getMonth()-1,1):new Date(cursor.getFullYear()-1,0,1);render()};next.onclick=()=>{cursor=view==='day'?addDays(cursor,1):view==='week'?addDays(cursor,7):view==='month'?new Date(cursor.getFullYear(),cursor.getMonth()+1,1):new Date(cursor.getFullYear()+1,0,1);render()};add.onclick=()=>openModal(null,iso(cursor));render();</script></body></html>
