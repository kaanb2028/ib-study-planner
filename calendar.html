<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner — Calendar</title><style>:root{--m:#7c3aed;--p:#2878e8;--e:#079669;--b:#d97706;--en:#db2777;--tr:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;color:#182235}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:22px 16px;background:#fafafa;border-right:1px solid var(--line)}.side a{display:block;padding:10px;text-decoration:none;color:#374151;border-radius:9px}.side .active{background:#eef2ff;font-weight:700}.brand{font-size:20px;font-weight:800;margin-bottom:20px}.top{height:74px;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}button{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:18px;cursor:pointer}.activeBtn{background:#eef0f3;font-weight:700}.grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:900px}.dow{text-align:center;padding:8px;border-bottom:1px solid var(--line)}.day{min-height:145px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px}.num{text-align:right}.ev{font-size:11px;padding:4px 5px;margin:2px 0;border-radius:5px;border-left:4px solid #777;background:#f3f4f6}.math{background:#f0eaff;border-color:var(--m)}.physics{background:#e9f2ff;border-color:var(--p)}.econ{background:#e5f8f0;border-color:var(--e)}.business{background:#fff1df;border-color:var(--b)}.english{background:#fce7f3;border-color:var(--en)}.turkish{background:#feeaea;border-color:var(--tr)}.exam{background:#fee2e2;border-color:#ef4444;font-weight:700}.lesson{background:#ede9fe;border-color:#6d28d9;font-weight:700}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}.mini{border:1px solid var(--line);border-radius:10px;padding:10px}.miniGrid{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;text-align:center;gap:2px}.miniGrid span{padding:4px}.has{background:#eef2ff;border-radius:4px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.year{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">IB Study Planner</div><a href="index.html">Today</a><a class="active" href="calendar.html">Calendar</a><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></aside><main><div class="top"><div><button id="today">Today</button> <button id="prev">‹</button> <button id="next">›</button> <b id="title" style="font-size:24px;margin-left:12px"></b></div><div><button data-v="month">Month</button><button data-v="year">Year</button></div></div><div id="cal"></div></main></div><script>const names={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL'},pools={math:['Functions & graphs — 8 IB questions','Quadratics — 10 questions','Graph transformations — 8 questions'],physics:['Kinematics — 8 questions','Motion graphs — 8 questions','SUVAT — 10 problems'],econ:['PPC + diagram','Demand & supply shifts','Price mechanism + application'],business:['Functional areas + application','Vision, mission & objectives','Strategy vs tactics'],english:['Analytical paragraph + edit'],turkish:['Reading + 5 notes']};let cur=new Date(),view=localStorage.getItem('ib-calendar-view')||'month';function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function plan(ds){let d=new Date(ds+'T12:00:00'),out=[];if(ds>='2026-10-01'&&ds<='2026-12-31'){let n=Math.floor((d-new Date('2026-10-01T12:00:00'))/86400000),cycle=[['math','physics'],['math','econ'],['physics','math'],['physics','econ'],['math','business'],['physics','math'],['econ','business'],['math','physics'],['physics','econ'],['math','business'],['physics','math'],['econ','english'],['math','physics'],['business','turkish']],pair=cycle[(n%cycle.length+cycle.length)%cycle.length];pair.forEach((s,k)=>out.push({t:names[s]+' — '+pools[s][Math.floor(Math.max(n,0)/2)%pools[s].length],time:k?'19:00':'17:00',kind:s}));if(d.getDay()===6)out.push({t:'MATH - HL with ESER',time:'10:00–11:30',kind:'lesson'});if(ds>='2026-11-04'&&ds<='2026-11-11')out.unshift({t:'EXAM WEEK',time:'08:00',kind:'exam'})}return out}function renderMonth(){title.textContent=cur.toLocaleString('en',{month:'long',year:'numeric'});let f=new Date(cur.getFullYear(),cur.getMonth(),1),s=monday(f),h='<div class="grid">';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>h+='<div class="dow">'+x+'</div>');for(let i=0;i<42;i++){let d=add(s,i),ds=iso(d);h+='<div class="day" style="'+(d.getMonth()!=cur.getMonth()?'background:#fafafa;color:#aaa':'')+'"><div class="num">'+d.getDate()+'</div>'+plan(ds).map(e=>'<div class="ev '+e.kind+'">'+e.time+' '+e.t+'</div>').join('')+'</div>'}cal.innerHTML=h+'</div>'}function renderYear(){title.textContent=cur.getFullYear();let h='<div class="year">';for(let m=0;m<12;m++){let f=new Date(cur.getFullYear(),m,1),s=monday(f);h+='<div class="mini"><b>'+f.toLocaleString('en',{month:'long'})+'</b><div class="miniGrid">';['M','T','W','T','F','S','S'].forEach(x=>h+='<b>'+x+'</b>');for(let i=0;i<42;i++){let d=add(s,i),ds=iso(d);h+='<span class="'+(plan(ds).length?'has':'')+'">'+d.getDate()+'</span>'}h+='</div></div>'}cal.innerHTML=h+'</div>'}function render(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('activeBtn',b.dataset.v===view));view==='year'?renderYear():renderMonth()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;localStorage.setItem('ib-calendar-view',view);render()});today.onclick=()=>{cur=new Date();render()};prev.onclick=()=>{cur=view==='year'?new Date(cur.getFullYear()-1,0,1):new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};next.onclick=()=>{cur=view==='year'?new Date(cur.getFullYear()+1,0,1):new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};render();</script></body></html>
