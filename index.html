<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:20px;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.top p{margin:5px 0}.pill{background:#eef2ff;color:#3730a3;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.kpi span,.meta{font-size:12px}.kpi strong{display:block;font-size:26px;margin-top:6px}.task{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:14px;margin:10px 0}.task.done{opacity:.5}.task h3{margin:0 0 4px;font-size:16px}.task-head{display:flex;justify-content:space-between;gap:10px}.priority,.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fef2f2;color:#b42318;white-space:nowrap} :#3730a3;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}.hidden{display:none!important}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modal{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#475569}.field input,.field select{width:100%;border:1px solid #d9dce5;border-radius:9px;padding:9px}.modalActions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.danger{color:#b42318;border-color:#fecaca}.hint{font-size:11px;color:#94a3b8;margin-top:3px}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.nav{display:flex;overflow:auto}.nav button,.nav a{width:auto;white-space:nowrap}.main{padding:14px}.kpis{grid-template-columns:1fr}.weekgrid{grid-template-columns:repeat(7,210px)}.subject,.deadline{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button class="active" data-view="today">Today</button><a href="calendar.html">Calendar</a><button data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView"></section><section id="weekView" class="hidden"></section><section id="deadlinesView" class="hidden"></section><section id="subjectsView" class="hidden"></section><section id="classroomView" class="hidden"></section></main></div><div id="modalRoot"></div><script>

var fixedEvents=[{date:'2026-09-28',title:'Basketball',start:'20:00',end:'21:00',kind:'busy'},{date:'2026-10-02',title:'Basketball Fundamental',start:'16:00',end:'17:00',kind:'busy'},{date:'2026-10-03',title:'Basketball',start:'17:00',end:'18:00',kind:'busy'},{date:'2026-10-04',title:'Padel',start:'20:00',end:'21:00',kind:'busy'},{date:'2026-09-30',title:'Gym',start:'18:00',end:'19:00',kind:'gym'},{date:'2026-10-04',title:'Gym',start:'18:00',end:'19:00',kind:'gym'},{date:'2026-10-02',title:'Fenerbahçe Beko — Match vs Dubai Basketball',start:'20:45',end:'22:45',kind:'match'},{date:'2026-10-04',title:'Fenerbahçe Beko — Match vs Manisa Basket',start:'15:30',end:'17:30',kind:'match'},{date:'2026-10-08',title:'Fenerbahçe Beko — Match at Panathinaikos',start:'21:15',end:'23:15',kind:'match'},{date:'2026-10-10',title:'Fenerbahçe — Football Match at Çaykur Rizespor',start:'19:00',end:'21:00',kind:'match'},{date:'2026-10-10',title:'Fenerbahçe Beko — Match at Çayırova Belediyesi',start:'19:30',end:'21:30',kind:'match'},{date:'2026-10-13',title:'Fenerbahçe Beko — Match vs Zalgiris Kaunas',start:'20:45',end:'22:45',kind:'match'}];
var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.done=state.done||{};state.topics=state.topics||{};state.steps=state.steps||{};state.deferred=state.deferred||{};state.customEvents=state.customEvents||[];state.eventOverrides=state.eventOverrides||{};state.deletedEvents=state.deletedEvents||{};subjects.forEach(function(s){if(state.topics[s.id]){s.topic=state.topics[s.id].topic||s.topic;s.stage=state.topics[s.id].stage||s.stage}});function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function pdate(s){return new Date(s+'T12:00:00')}function ld(d){var x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){var x=new Date(d),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(12,0,0,0);return x}function fmt(s,o){return pdate(s).toLocaleDateString('en-GB',o||{month:'short',day:'numeric'})}function subj(id){return subjects.find(function(s){return s.id===id})}function realToday(){return ld(new Date())}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function baseEventId(e,i){return 'base-'+e.date+'-'+e.start+'-'+e.title.replace(/[^a-z0-9]/gi,'').slice(0,20)+'-'+i}function padel(date){var d=pdate(date).getDay();return d===2||d===4}function generatedEvents(date){var a=fixedEvents.filter(function(e){return e.date===date}).map(function(e,i){return Object.assign({},e,{id:baseEventId(e,i),source:'base'})});if(padel(date)&&!a.some(function(e){return e.title==='Padel'&&e.start==='16:00'}))a.push({id:'auto-padel-'+date,date:date,title:'Padel',start:'16:00',end:'17:00',kind:'busy',source:'auto'});if(pdate(date).getDay()===5&&!a.some(function(e){return e.title==='English Lesson'}))a.push({id:'auto-english-'+date,date:date,title:'English Lesson',start:'18:00',end:'20:00',kind:'busy',source:'auto'});return a}function events(date){var a=generatedEvents(date).filter(function(e){return!state.deletedEvents[e.id]}).map(function(e){return Object.assign({},e,state.eventOverrides[e.id]||{})});state.customEvents.filter(function(e){return e.date===date}).forEach(function(e){a.push(Object.assign({},e,{source:'custom'}))});return a.sort(function(a,b){return(a.start||'99:99').localeCompare(b.start||'99:99')})}function gyms(mon){var c=[{i:0,s:'18:00'},{i:2,s:'18:00'},{i:5,s:'18:00'},{i:6,s:'17:00'}],out=[];c.forEach(function(x){if(out.length>=3)return;var date=ld(add(mon,x.i));if(events(date).some(function(e){return e.start===x.s}))return;var h=(parseInt(x.s)+1).toString().padStart(2,'0')+':00';out.push({id:'auto-gym-'+date,date:date,title:'Gym',start:x.s,end:h,kind:'gym',source:'gym'})});return out}
function actions(sid,type){if(type==='quiz'&&sid==='math')return['Review Algebra notes and 1 worked example','Solve 8 Algebra questions','Mark and redo every wrong question'];if(type==='quiz'&&sid==='physics')return['Review Kinematics definitions and formulas','Solve 5 exam-style questions','Mark them and note 2 weak points'];if(type==='quiz'&&sid==='econ')return['Write Price Mechanism definitions from memory','Draw 2 supply/demand diagrams','Answer 1 exam-style question and mark it'];if(type==='quiz'&&sid==='business')return['Review Vision vs Mission vs Strategy vs Tactics','Make a 4-row comparison table','Answer 2 short case/application questions'];if(type==='lab')return['Finish data table and calculations','Create or check the first graph','Write findings and list what is missing'];if(type==='reading')return["Read today's target section",'Write 5 bullet notes','Do a 2-minute recall without looking'];if(type==='homework')return['Finish remaining required work','Check formatting and missing parts','Final proofread and upload-ready check'];if(sid==='econ')return['Review Price Mechanism definitions','Draw 2 diagrams from memory','Do 1 short response'];if(sid==='physics')return['Review Kinematics formulas','Solve 4 introductory questions','Note unclear points'];if(sid==='business')return["Review today's Business notes",'Write 3 key distinctions from memory','Do 1 application question'];return["Review today's Algebra notes",'Solve 6 practice questions','Check and redo mistakes']}
function dailyStudy(date,index){
 var d=pdate(date),dow=d.getDay(),pairs=[['math','physics'],['econ','business'],['math','econ'],['physics','business'],['math','business'],['physics','econ']],pair=pairs[index%pairs.length];
 function topic(sid){
  var pools={
   math:['Functions: domain/range + 6 questions','Quadratics: roots/discriminant + 8 questions','Graph transformations + 6 questions','Polynomials: factor/remainder theorem + 6 questions','Sequences & series + 8 questions','Exponents & logarithms + 8 questions','Mixed Algebra timed set'],
   physics:['Distance/displacement/speed/velocity','Motion graphs: gradients & areas','SUVAT: choose equation + 6 problems','SUVAT mixed exam-style set','Relative motion + 4 questions','Kinematics timed review'],
   econ:['Scarcity, opportunity cost & PPC','Demand: movement vs shift + diagrams','Supply: movement vs shift + diagrams','Market equilibrium: shortage/surplus','Price mechanism: signals & incentives','Consumer/producer surplus','Allocative efficiency: MB = MC'],
   business:['Inputs/processes/outputs','Functional areas + application','Sectors + added value','Business entities comparison','Vision vs mission','Business objectives','Strategic vs tactical objectives','CSR + application']
  };
  return pools[sid][Math.floor(index/2)%pools[sid].length]
 }
 var out=pair.map(function(sid,k){return{id:'daily-'+date+'-'+sid,subject:sid,title:topic(sid),type:'topic',deadline:null,actions:actions(sid,'topic')}})
 if(dow===6)out.push({id:'daily-'+date+'-turkish',subject:'turkish',title:'Deneme / reading — 30 min',type:'topic',deadline:null,actions:['Make a short outline or read for 20 minutes','Write 5 notes','Revise one paragraph']});
 if(dow===0)out.push({id:'daily-'+date+'-english',subject:'english',title:'Writing — 30 min',type:'topic',deadline:null,actions:['Write one full paragraph','Check topic sentence and evidence','Edit clarity and grammar']});
 return out
}
function plan(start,days){
 var out={},i;for(i=0;i<days;i++)out[ld(add(start,i))]=[];
 var from=ld(start),to=ld(add(start,days-1));
 deadlines.forEach(function(d){
  if(d.date<from||d.date>to)return;
  var lead=d.type==='quiz'?5:d.type==='lab'?4:2,total=d.type==='quiz'?4:d.type==='lab'?3:2,c=0;
  for(var b=lead;b>=1&&c<total;b--){
   var date=ld(add(pdate(d.date),-b));if(!out[date])continue;
   out[date].push({id:d.id+'-'+date,subject:d.subject,title:d.title,type:d.type,deadline:d.date,actions:actions(d.subject,d.type)});c++
  }
 });
 for(i=0;i<days;i++){
  var date=ld(add(start,i)),base=dailyStudy(date,i);
  base.forEach(function(t){if(!out[date].some(function(x){return x.subject===t.subject}))out[date].push(t)});
  while(out[date].length<2){var filler=dailyStudy(date,i+1)[0];out[date].push(filler)}
 }
 return out
}
var weekOffset=0;function anchor(){return monday(pdate(realToday()))}function estimateMinutes(t){if(t.type==='quiz')return 45;if(t.type==='lab')return 50;if(t.type==='homework')return 40;if(t.type==='reading')return 35;return subj(t.subject).level==='HL'?35:25}function priorityLabel(t){if(t.deadline){var d=(pdate(t.deadline)-pdate(realToday()))/86400000;if(d<=2)return'MUST DO';if(d<=5)return'HIGH PRIORITY'}return'KEEP UP'}function taskHTML(t){var s=subj(t.subject),done=!!state.done[t.id],m=t.deadline?'For deadline: '+fmt(t.deadline,{weekday:'short',month:'short',day:'numeric'}):'Current topic: '+s.topic,mins=estimateMinutes(t),p=priorityLabel(t),ss=state.steps[t.id]||{};return '<article class="task '+(done?'done':'')+'" style="border-left-color:'+s.color+'"><div class="task-head"><div><h3>'+s.name+' '+s.level+' — '+esc(t.title)+'</h3><div class="meta">'+m+' <span class="duration">≈ '+mins+' min</span></div></div><span class="priority">'+p+'</span></div><div class="steps">'+t.actions.map(function(a,i){return '<label class="step"><input type="checkbox" class="stepBox" data-task="'+t.id+'" data-step="'+i+'" '+(ss[i]?'checked':'')+'><span>'+esc(a)+'</span></label>'}).join('')+'</div><div class="goal">Finish this: complete the actions above and correct your mistakes.</div><div class="actions"><button class="btn primary doneBtn" data-id="'+t.id+'">'+(done?'Completed ✓':'Done')+'</button><button class="btn moreBtn" data-id="'+t.id+'">Need more time</button><button class="btn skipBtn" data-id="'+t.id+'">Couldn\'t do it</button></div></article>'}function bind(){document.querySelectorAll('.doneBtn').forEach(function(b){b.onclick=function(){state.done[b.dataset.id]=!state.done[b.dataset.id];save();renderAll()}});document.querySelectorAll('.stepBox').forEach(function(b){b.onchange=function(){state.steps[b.dataset.task]=state.steps[b.dataset.task]||{};state.steps[b.dataset.task][b.dataset.step]=b.checked;save()}})}
function renderToday(){var today=realToday(),pl=plan(pdate(today),28)[today]||[],done=pl.filter(function(x){return state.done[x.id]}).length,soon=deadlines.filter(function(d){var z=(pdate(d.date)-pdate(today))/86400000;return z>=0&&z<=7}).length,urgent=pl.filter(function(t){return t.deadline}),maintenance=pl.filter(function(t){return!t.deadline}),label=pdate(today).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('todayView').innerHTML='<div class="top"><div><h1>Today</h1><p>'+label+' · no guessing: just execute the next actions</p></div><span class="pill">Goal: IB 40</span></div><div class="grid kpis"><div class="card kpi"><span>Focused tasks</span><strong>'+pl.length+'</strong></div><div class="card kpi"><span>Completed</span><strong>'+done+'/'+pl.length+'</strong></div><div class="card kpi"><span>Upcoming deadlines</span><strong>'+soon+'</strong></div></div><div class="card"><div class="today-group">Must do / deadline work</div>'+(urgent.length?urgent.map(taskHTML).join(''):'<div class="meta">No urgent deadline task today.</div>')+'<div class="today-group">Keep up with class</div>'+(maintenance.length?maintenance.map(taskHTML).join(''):'<div class="meta">No maintenance task today.</div>')+'</div>';bind()}
function eventCard(e){return '<div class="mini '+esc(e.kind||'busy')+' editable" data-event="'+esc(e.id)+'" data-source="'+esc(e.source||'')+'" title="Click to edit">'+esc(e.start)+'–'+esc(e.end)+'<br><b>'+esc(e.title)+'</b></div>'}function renderWeek(){var mon=add(anchor(),weekOffset*7),key=ld(mon),pl=plan(mon,28),gs=gyms(mon),html='',today=realToday();for(var i=0;i<7;i++){var d=ld(add(mon,i)),its=pl[d]||[],ev=events(d).concat(gs.filter(function(g){return g.date===d}));html+='<div class="day '+(d===today?'today':'')+'"><h4>'+pdate(d).toLocaleDateString('en-GB',{weekday:'short'})+'</h4><div class="date">'+fmt(d)+'</div><button class="addEvent" data-date="'+d+'">＋ Add event</button>'+ev.map(eventCard).join('')+its.map(function(t){return '<div class="mini" style="border-left-color:'+subj(t.subject).color+'"><b>'+subj(t.subject).name+'</b><br>'+(t.type==='topic'?esc(t.title):'Prep: '+esc(t.title))+'</div>'}).join('')+'</div>'}document.getElementById('weekView').innerHTML='<div class="top"><div><h1>Week</h1><p>Click any event to edit it, or add your own.</p></div><span class="pill">Editable rolling plan</span></div><div class="weekbar"><button class="btn" id="prev">← Previous</button><strong>'+fmt(key,{month:'long',day:'numeric'})+' – '+fmt(ld(add(mon,6)),{month:'long',day:'numeric'})+'</strong><div><button class="btn" id="regen">Refresh week</button> <button class="btn" id="next">Next →</button></div></div><div class="weekgrid">'+html+'</div>';prev.onclick=function(){weekOffset=Math.max(0,weekOffset-1);renderWeek()};next.onclick=function(){weekOffset=Math.min(3,weekOffset+1);renderWeek()};regen.onclick=renderWeek;document.querySelectorAll('.addEvent').forEach(function(b){b.onclick=function(){openEventModal(null,b.dataset.date)}});document.querySelectorAll('.editable').forEach(function(b){b.onclick=function(){var id=b.dataset.event,e=findEvent(id);if(e)openEventModal(e,e.date)}})}function findEvent(id){for(var i=0;i<state.customEvents.length;i++)if(state.customEvents[i].id===id)return Object.assign({},state.customEvents[i],{source:'custom'});var mon=add(anchor(),weekOffset*7),gs=gyms(mon);for(var j=0;j<7;j++){var a=events(ld(add(mon,j))).concat(gs.filter(function(g){return g.date===ld(add(mon,j))}));for(var k=0;k<a.length;k++)if(a[k].id===id)return a[k]}return null}
function openEventModal(e,date){var editing=!!e,id=e&&e.id||'',src=e&&e.source||'custom';document.getElementById('modalRoot').innerHTML='<div class="modalBack" id="back"><div class="modal"><h2>'+(editing?'Edit event':'Add event')+'</h2><div class="field"><label>Title</label><input id="evTitle" value="'+esc(e&&e.title||'')+'" placeholder="e.g. Economics study"></div><div class="field"><label>Date</label><input id="evDate" type="date" value="'+esc(e&&e.date||date)+'"></div><div class="field"><label>Start time</label><input id="evStart" type="time" value="'+esc(e&&e.start||'17:00')+'"></div><div class="field"><label>End time</label><input id="evEnd" type="time" value="'+esc(e&&e.end||'18:00')+'"></div><div class="field"><label>Type</label><select id="evKind"><option value="busy">Activity / Lesson</option><option value="gym">Gym / Sport</option><option value="match">Match / Event</option><option value="study">Study</option></select><div class="hint">Changes are saved on this device.</div></div><div class="modalActions"><div>'+(editing?'<button class="btn danger" id="deleteEv">Delete</button>':'')+'</div><div><button class="btn" id="cancelEv">Cancel</button> <button class="btn primary" id="saveEv">Save</button></div></div></div></div>';document.getElementById('evKind').value=e&&e.kind||'busy';cancelEv.onclick=closeModal;back.onclick=function(x){if(x.target===back)closeModal()};saveEv.onclick=function(){var obj={id:id||'custom-'+Date.now(),date:evDate.value,title:evTitle.value.trim(),start:evStart.value,end:evEnd.value,kind:evKind.value};if(!obj.title||!obj.date||!obj.start||!obj.end)return alert('Please fill title, date and times.');if(editing&&src==='custom'){var ix=state.customEvents.findIndex(function(x){return x.id===id});if(ix>=0)state.customEvents[ix]=obj}else if(editing){state.eventOverrides[id]=obj}else state.customEvents.push(obj);save();closeModal();renderWeek()};if(editing)deleteEv.onclick=function(){if(src==='custom')state.customEvents=state.customEvents.filter(function(x){return x.id!==id});else state.deletedEvents[id]=true;save();closeModal();renderWeek()}}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function renderDeadlines(){document.getElementById('deadlinesView').innerHTML='<div class="top"><div><h1>Deadlines</h1><p>Real dates stay fixed. Preparation is planned before them.</p></div></div><div class="card">'+deadlines.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(d){var s=subj(d.subject);return '<div class="deadline"><strong>'+fmt(d.date,{month:'short',day:'numeric'})+'</strong><div><b>'+esc(d.title)+'</b><div class="meta">'+s.name+' '+s.level+' · '+esc(s.topic)+'</div></div><span class="tag">'+d.type.toUpperCase()+'</span></div>'}).join('')+'</div>'}function renderSubjects(){document.getElementById('subjectsView').innerHTML='<div class="top"><div><h1>Subjects</h1><p>Update topics when class moves on; the plan adapts.</p></div></div><div class="card">'+subjects.map(function(s){return '<div class="subject"><div><span class="dot" style="background:'+s.color+'"></span><b>'+s.name+' '+s.level+'</b></div><input class="topicInput" data-topic="'+s.id+'" value="'+esc(s.topic)+'"><select class="stageInput" data-stage="'+s.id+'"><option value="ongoing">In progress</option><option value="started">Started</option><option value="finished">Finished</option></select></div>'}).join('')+'</div>';document.querySelectorAll('.topicInput').forEach(function(x){x.onchange=function(){var s=subj(x.dataset.topic);s.topic=x.value;state.topics[s.id]={topic:s.topic,stage:s.stage};save()}})}function renderClassroom(){document.getElementById('classroomView').innerHTML='<div class="top"><div><h1>Classroom</h1><p>Your school account blocks direct third-party Classroom access.</p></div></div><div class="card"><b>Manual mode</b><p class="meta">Add new assignments and deadlines to the planner as they arrive.</p></div>'}function renderAll(){renderToday();renderWeek();renderDeadlines();renderSubjects();renderClassroom()}document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');['today','week','deadlines','subjects','classroom'].forEach(function(v){document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view)})}});renderAll();</script></body></html>
