<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:visible}.brand{font-weight:800;font-size:20px;margin-bottom:22px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav{display:flex;flex-direction:column;gap:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.nav .power{margin-top:5px;background:#182235;color:#fff;font-weight:750}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.pill{background:#eef2ff;color:#3730a3;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.kpi span,.meta{font-size:12px}.kpi strong{display:block;font-size:26px;margin-top:6px}.task{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:14px;margin:10px 0}.task h3{margin:0 0 4px}.task-head{display:flex;justify-content:space-between;gap:10px}.priority,.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f3f4f6}.steps{display:grid;gap:7px;margin-top:10px}.step{font-size:14px}.goal{background:#f8fafc;border-radius:10px;padding:9px;margin-top:10px;font-size:13px;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow:auto}.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;min-height:260px}.mini{padding:7px 8px;border-radius:8px;margin:6px 0;font-size:12px;border-left:4px solid var(--accent);background:#f8fafc}.subject,.deadline{display:grid;grid-template-columns:180px 1fr 150px;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.brand{margin-bottom:10px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;overflow:visible}.nav button,.nav a{width:100%;white-space:normal;margin:0}.main{padding:14px}.kpis{grid-template-columns:1fr}.weekgrid{grid-template-columns:repeat(7,210px)}.subject,.deadline{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button class="active" data-view="today">Today</button><button data-view="week">Week</button><button data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a class="power" href="quiz.html">🧠 Take Quiz</a><a class="power" href="mistakes.html">❌ Mistake Bank</a><a class="power" href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView"></section><section id="weekView" class="hidden"></section><section id="deadlinesView" class="hidden"></section><section id="subjectsView" class="hidden"></section><section id="classroomView" class="hidden"></section></main></div>
<script>
var COLORS={math:'#7c3aed',physics:'#2563eb',econ:'#059669',business:'#d97706',english:'#db2777',turkish:'#dc2626'};var subjects=[{id:'math',name:'Math',level:'HL',topic:'Algebra',color:COLORS.math},{id:'physics',name:'Physics',level:'HL',topic:'Kinematics',color:COLORS.physics},{id:'econ',name:'Economics',level:'HL',topic:'Price Mechanism',color:COLORS.econ},{id:'business',name:'Business',level:'SL',topic:'Vision, Mission, Strategies & Tactics',color:COLORS.business},{id:'english',name:'English',level:'SL',topic:'Writing',color:COLORS.english},{id:'turkish',name:'Turkish',level:'SL',topic:'Deneme / Essay Writing',color:COLORS.turkish}];var deadlines=[{subject:'turkish',title:'Upload Turkish Portfolio',date:'2026-10-02',type:'homework'},{subject:'math',title:'Math HL Quiz',date:'2026-10-05',type:'quiz'},{subject:'turkish',title:'Read Şeyh Bedrettin Destanı',date:'2026-10-05',type:'reading'},{subject:'econ',title:'Economics HL Quiz',date:'2026-10-06',type:'quiz'},{subject:'physics',title:'Physics HL Quiz',date:'2026-10-06',type:'quiz'},{subject:'physics',title:'Physics Lab Assignment',date:'2026-10-06',type:'lab'},{subject:'business',title:'Business SL Quiz',date:'2026-10-13',type:'quiz'}];var events=[['2026-10-02','Basketball Fundamental','16:00'],['2026-10-02','English Lesson','18:00'],['2026-10-03','Basketball','17:00'],['2026-10-04','Gym','18:00'],['2026-10-04','Padel','20:00'],['2026-10-02','Fenerbahçe Beko — Dubai Basketball','20:45'],['2026-10-04','Fenerbahçe Beko — Manisa Basket','15:30']];
function S(id){return subjects.find(x=>x.id===id)}function task(s,title,acts){return '<div class="task" style="border-left-color:'+S(s).color+'"><div class="task-head"><div><h3>'+S(s).name+' '+S(s).level+' — '+title+'</h3><div class="meta">Current topic: '+S(s).topic+'</div></div><span class="priority">KEEP UP</span></div><div class="steps">'+acts.map(a=>'<label class="step"><input type="checkbox"> '+a+'</label>').join('')+'</div><div class="goal">Finish the actions and correct your mistakes.</div></div>'}
function today(){todayView.innerHTML='<div class="top"><div><h1>Today</h1><p>Wednesday, 30 September 2026 · execute the next actions</p></div><span class="pill">Goal: IB 40</span></div><div class="grid kpis"><div class="card kpi"><span>Focused tasks</span><strong>3</strong></div><div class="card kpi"><span>Quiz tools</span><strong>3</strong></div><div class="card kpi"><span>Upcoming deadlines</span><strong>6</strong></div></div><div class="card">'+task('econ','Price Mechanism — Definitions',['Memorise 10 key definitions','Recall all 10 without notes','Write and repeat missed definitions'])+task('math','Algebra',['Review today’s class work','Solve 6 hard practice questions','Redo every mistake'])+task('physics','Kinematics',['Review formulas','Solve 4 kinematics problems','Note unclear points'])+'</div>'}
function week(){let ds=['2026-09-28','2026-09-29','2026-09-30','2026-10-01','2026-10-02','2026-10-03','2026-10-04'];weekView.innerHTML='<div class="top"><div><h1>Week</h1><p>Study planned around sport and lessons.</p></div></div><div class="weekgrid">'+ds.map(d=>'<div class="day"><b>'+new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short'})+'</b><div class="meta">'+d+'</div>'+events.filter(e=>e[0]===d).map(e=>'<div class="mini">'+e[2]+'<br><b>'+e[1]+'</b></div>').join('')+'</div>').join('')+'</div>'}
function dl(){deadlinesView.innerHTML='<div class="top"><div><h1>Deadlines</h1></div></div><div class="card">'+deadlines.map(d=>'<div class="deadline"><b>'+d.date.slice(5)+'</b><div><b>'+d.title+'</b><div class="meta">'+S(d.subject).name+' '+S(d.subject).level+'</div></div><span class="tag">'+d.type.toUpperCase()+'</span></div>').join('')+'</div>'}
function subs(){subjectsView.innerHTML='<div class="top"><div><h1>Subjects</h1><p>Current IB topics.</p></div></div><div class="card">'+subjects.map(s=>'<div class="subject"><b>'+s.name+' '+s.level+'</b><div>'+s.topic+'</div><span class="tag">IN PROGRESS</span></div>').join('')+'</div>'}
function classroom(){classroomView.innerHTML='<div class="top"><div><h1>Classroom</h1><p>School Google Classroom access is currently restricted, so keep important deadlines in the planner manually.</p></div></div><div class="card"><b>Manual mode</b><p class="meta">Tell me new assignments, quizzes or deadlines and we can add them here without requiring school account access.</p></div>'}
function render(){today();week();dl();subs();classroom()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=function(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['today','week','deadlines','subjects','classroom'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view))});render();
</script></body></html>
