<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px}.brand{font-weight:800;font-size:20px;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.deadline{display:grid;grid-template-columns:100px minmax(250px,1fr) auto 145px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fef2f2;color:#b42318;white-space:nowrap}.completeBtn{display:inline-flex!important;align-items:center;justify-content:center;border:1px solid #86efac!important;background:#dcfce7!important;color:#166534!important;padding:8px 12px!important;border-radius:9px!important;font-weight:800!important;cursor:pointer!important;min-width:125px!important;visibility:visible!important;opacity:1!important}.completeBtn:hover{background:#bbf7d0!important}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px}.nav{display:flex;overflow:auto}.nav button,.nav a{width:auto;white-space:nowrap}.main{padding:14px}.deadline{grid-template-columns:1fr}.completeBtn{width:100%}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button data-view="today">Today</button><a href="calendar.html">Calendar</a><button class="active" data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView" class="hidden"><div class="top"><h1>Today</h1></div></section><section id="deadlinesView"></section><section id="subjectsView" class="hidden"><div class="top"><h1>Subjects</h1></div></section><section id="classroomView" class="hidden"><div class="top"><h1>Classroom</h1><p>Google Classroom assignments sync into your planner automatically.</p></div></section></main></div><script>var subjects={math:'Math HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL',other:'Other'};var deadlines=[{id:'tur-portfolio',subject:'turkish',title:'Upload Turkish Portfolio',date:'2026-10-02',type:'homework'},{id:'math-quiz',subject:'math',title:'Math HL Quiz',date:'2026-10-05',type:'quiz'},{id:'tur-reading',subject:'turkish',title:'Read Şeyh Bedrettin Destanı',date:'2026-10-05',type:'reading'},{id:'econ-quiz',subject:'econ',title:'Economics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-quiz',subject:'physics',title:'Physics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-lab',subject:'physics',title:'Physics Lab Assignment',date:'2026-10-06',type:'lab'},{id:'business-quiz',subject:'business',title:'Business SL Quiz',date:'2026-10-13',type:'quiz'}];var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.completedDeadlines=state.completedDeadlines||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{month:'short',day:'numeric'})}function renderDeadlines(){var active=deadlines.filter(function(d){return!state.completedDeadlines[d.id]}).sort(function(a,b){return a.date.localeCompare(b.date)});document.getElementById('deadlinesView').innerHTML='<div class="top"><h1>Deadlines</h1><p>When you finish a task, press Completed and it will disappear from this list.</p></div><div class="card">'+(active.length?active.map(function(d){return '<div class="deadline"><strong>'+fmt(d.date)+'</strong><div><b>'+esc(d.title)+'</b><div class="meta">'+esc(subjects[d.subject]||d.subject||'Other')+'</div></div><span class="tag">'+esc((d.type||'TASK').toUpperCase())+'</span><button type="button" class="completeBtn" data-complete="'+esc(d.id)+'">✓ Completed</button></div>'}).join(''):'<div class="empty">🎉 No active deadlines.</div>')+'</div>';document.querySelectorAll('.completeBtn').forEach(function(b){b.addEventListener('click',function(){state.completedDeadlines[b.dataset.complete]=true;save();renderDeadlines()})})}async function loadClassroom(){try{var r=await fetch('classroom-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;var j=await r.json();(j.items||[]).forEach(function(x){if(x.date&&!deadlines.some(function(d){return d.id===x.id}))deadlines.push(x)});renderDeadlines()}catch(e){}}renderDeadlines();loadClassroom();document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');['today','deadlines','subjects','classroom'].forEach(function(v){document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view)})}});</script></body></html>
