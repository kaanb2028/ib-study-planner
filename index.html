<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:20px;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.top p{margin:5px 0}.pill{background:#eef2ff;color:#3730a3;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.deadline{display:grid;grid-template-columns:100px 1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fef2f2;color:#b42318;white-space:nowrap}.completeBtn{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;padding:7px 10px;border-radius:9px;font-weight:800;cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.nav{display:flex;overflow:auto}.nav button,.nav a{width:auto;white-space:nowrap}.main{padding:14px}.deadline{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button class="active" data-view="today">Today</button><a href="calendar.html">Calendar</a><button data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView"><div class="top"><div><h1>Today</h1><p>Your existing Today planner remains available through your saved browser state.</p></div></div></section><section id="deadlinesView" class="hidden"></section><section id="subjectsView" class="hidden"><div class="top"><div><h1>Subjects</h1></div></div></section><section id="classroomView" class="hidden"><div class="top"><div><h1>Classroom</h1><p>Google Classroom assignments sync into your planner automatically.</p></div></div></section></main></div><script>
var subjects={math:'Math HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL',other:'Other'};
var deadlines=[{id:'tur-portfolio',subject:'turkish',title:'Upload Turkish Portfolio',date:'2026-10-02',type:'homework'},{id:'math-quiz',subject:'math',title:'Math HL Quiz',date:'2026-10-05',type:'quiz'},{id:'tur-reading',subject:'turkish',title:'Read Şeyh Bedrettin Destanı',date:'2026-10-05',type:'reading'},{id:'econ-quiz',subject:'econ',title:'Economics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-quiz',subject:'physics',title:'Physics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-lab',subject:'physics',title:'Physics Lab Assignment',date:'2026-10-06',type:'lab'},{id:'business-quiz',subject:'business',title:'Business SL Quiz',date:'2026-10-13',type:'quiz'}];
var state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}');state.completedDeadlines=state.completedDeadlines||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{month:'short',day:'numeric'})}
async function loadClassroom(){try{var r=await fetch('classroom-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;var j=await r.json();(j.items||[]).forEach(function(x){if(x.date&&!deadlines.some(function(d){return d.id===x.id}))deadlines.push(x)});renderDeadlines()}catch(e){}}
function renderDeadlines(){var active=deadlines.filter(function(d){return!state.completedDeadlines[d.id]}).sort(function(a,b){return a.date.localeCompare(b.date)});document.getElementById('deadlinesView').innerHTML='<div class="top"><div><h1>Deadlines</h1><p>Complete an item and it disappears from this list.</p></div></div><div class="card">'+(active.length?active.map(function(d){return '<div class="deadline"><strong>'+fmt(d.date)+'</strong><div><b>'+esc(d.title)+'</b><div class="meta">'+esc(subjects[d.subject]||d.subject||'Other')+'</div></div><span class="tag">'+esc((d.type||'TASK').toUpperCase())+'</span><button class="completeBtn" data-complete="'+esc(d.id)+'">✓ Completed</button></div>'}).join(''):'<div class="empty">🎉 No active deadlines.</div>')+'</div>';document.querySelectorAll('[data-complete]').forEach(function(b){b.onclick=function(){state.completedDeadlines[b.dataset.complete]=true;save();renderDeadlines()}})}
renderDeadlines();loadClassroom();document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');['today','deadlines','subjects','classroom'].forEach(function(v){document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view)})}});
</script></body></html>
