<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6c7484;--line:#e7e9f0;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}.brand{font-weight:800;font-size:20px;margin-bottom:22px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav{display:flex;flex-direction:column;gap:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.nav .power{margin-top:5px;background:#182235;color:#fff;font-weight:750}.main{padding:26px;min-width:0;width:100%;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.pill{background:#eef2ff;color:#3730a3;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.kpi span,.meta{font-size:12px}.kpi strong{display:block;font-size:26px;margin-top:6px}.task{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:14px;margin:10px 0}.task h3{margin:0 0 4px}.steps{display:grid;gap:7px;margin-top:10px}.goal{background:#f8fafc;border-radius:10px;padding:9px;margin-top:10px;font-size:13px;font-weight:700}.weeknotice{background:#eef2ff;color:#3730a3;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}.weekbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:12px 0}.weekbar .right{text-align:right}.weektitle{text-align:center;font-size:16px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;cursor:pointer}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;width:100%}.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;min-height:360px}.day.today{outline:2px solid var(--accent)}.day h4{margin:0;font-size:15px}.date{font-size:12px;color:var(--muted);margin:2px 0 8px}.mini{padding:8px;border-radius:8px;margin:6px 0;font-size:12px;border-left:4px solid var(--accent);background:#f8fafc;overflow-wrap:anywhere}.busy{border-left-color:#111827;background:#f3f4f6}.gym{border-left-color:#06b6d4;background:#ecfeff}.match{border-left-color:#f59e0b;background:#fffbeb}.math{border-left-color:#7c3aed}.physics{border-left-color:#2563eb}.econ{border-left-color:#059669}.business{border-left-color:#d97706}.turkish{border-left-color:#dc2626}.subject,.deadline{display:grid;grid-template-columns:180px 1fr 150px;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f3f4f6}.hidden{display:none!important}@media(max-width:1150px){.weekgrid{grid-template-columns:repeat(7,175px);overflow-x:auto}.day{min-height:330px}}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:14px}.kpis{grid-template-columns:1fr}.weekgrid{grid-template-columns:repeat(7,210px);overflow-x:auto}.subject,.deadline{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button class="active" data-view="today">Today</button><button data-view="week">Week</button><button data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a class="power" href="notes.html">📚 Study Notes</a><a class="power" href="quiz.html">🧠 Take Quiz</a><a class="power" href="mistakes.html">❌ Mistake Bank</a><a class="power" href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView"></section><section id="weekView" class="hidden"></section><section id="deadlinesView" class="hidden"></section><section id="subjectsView" class="hidden"></section><section id="classroomView" class="hidden"></section></main></div><script>
const subjects={math:['Math','HL','Algebra'],physics:['Physics','HL','Kinematics'],econ:['Economics','HL','Price Mechanism'],business:['Business','SL','Vision, Mission, Strategies & Tactics'],english:['English','SL','Writing'],turkish:['Turkish','SL','Deneme / Essay Writing']};
const deadlines=[['turkish','Upload Turkish Portfolio','2026-10-02','homework'],['math','Math HL Quiz','2026-10-05','quiz'],['turkish','Read Şeyh Bedrettin Destanı','2026-10-05','reading'],['econ','Economics HL Quiz','2026-10-06','quiz'],['physics','Physics HL Quiz','2026-10-06','quiz'],['physics','Physics Lab Assignment','2026-10-06','lab'],['business','Business SL Quiz','2026-10-13','quiz']];
const fixed=[['2026-09-28','Basketball','20:00','busy'],['2026-09-30','Gym','18:00','gym'],['2026-10-02','Basketball Fundamental','16:00','busy'],['2026-10-02','English Lesson','18:00','busy'],['2026-10-02','Fenerbahçe Beko — Match vs Dubai Basketball','20:45','match'],['2026-10-03','Basketball','17:00','busy'],['2026-10-04','Fenerbahçe Beko — Match vs Manisa Basket','15:30','match'],['2026-10-04','Gym','18:00','gym'],['2026-10-04','Padel','20:00','busy'],['2026-10-05','Gym','18:00','gym'],['2026-10-06','Padel','16:00','busy'],['2026-10-07','Gym','18:00','gym'],['2026-10-08','Padel','16:00','busy'],['2026-10-08','Fenerbahçe Beko — Match at Panathinaikos','21:15','match'],['2026-10-09','Gym','18:00','gym'],['2026-10-10','Fenerbahçe — Football Match at Çaykur Rizespor','19:00','match'],['2026-10-10','Fenerbahçe Beko — Match at Çayırova Belediyesi','19:30','match']];
let weekOffset=0;function D(s){return new Date(s+'T12:00:00')}function iso(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){let x=new Date(d),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(12,0,0,0);return x}function ev(date){let a=fixed.filter(x=>x[0]===date).slice();let dow=D(date).getDay();if((dow===2||dow===4)&&!a.some(x=>x[1]==='Padel'))a.push([date,'Padel','16:00','busy']);if(dow===5&&!a.some(x=>x[1]==='English Lesson'))a.push([date,'English Lesson','18:00','busy']);return a.sort((a,b)=>a[2].localeCompare(b[2]))}
function prep(date){let out=[];deadlines.forEach(d=>{let diff=Math.round((D(d[2])-D(date))/86400000);if(diff>=1&&diff<=4){let label=diff===1?'Final prep: ':'Prep: ';out.push([d[0],label+d[1]])}});return out.slice(0,4)}
function task(s,title,acts){return `<div class="task ${s}"><h3>${subjects[s][0]} ${subjects[s][1]} — ${title}</h3><div class="steps">${acts.map(a=>`<label><input type="checkbox"> ${a}</label>`).join('')}</div><div class="goal">Finish this and correct every mistake.</div></div>`}
function today(){todayView.innerHTML=`<div class="top"><div><h1>Today</h1><p>Wednesday, 30 September 2026 · concrete actions, not vague study blocks</p></div><span class="pill">Goal: IB 40</span></div><div class="grid kpis"><div class="card kpi"><span>Focused tasks</span><strong>3</strong></div><div class="card kpi"><span>Quiz tools</span><strong>3</strong></div><div class="card kpi"><span>Upcoming deadlines</span><strong>6</strong></div></div><div class="card">${task('econ','Price Mechanism',['Memorise 10 key definitions','Draw one demand/supply graph','Answer one application question'])}${task('math','Algebra',['Review class work','Solve 6 hard questions','Redo every mistake'])}${task('physics','Kinematics',['Review formulas','Solve 4 exam-style problems','Note unclear points'])}</div>`}
function week(){let base=monday(D('2026-09-30'));let mon=add(base,weekOffset*7),days=Array.from({length:7},(_,i)=>add(mon,i));let title=mon.getMonth()===add(mon,6).getMonth()?`${mon.getDate()}–${add(mon,6).getDate()} ${mon.toLocaleDateString('en-GB',{month:'long'})}`:`${mon.getDate()} ${mon.toLocaleDateString('en-GB',{month:'short'})} – ${add(mon,6).getDate()} ${add(mon,6).toLocaleDateString('en-GB',{month:'short'})}`;weekView.innerHTML=`<div class="top"><div><h1>Week</h1><p>Study planned around sport, lessons, matches and deadlines.</p></div><span class="pill">Rolling 4-week plan</span></div><div class="weeknotice">Auto-generated plan — deadlines and fixed activities stay visible together.</div><div class="weekbar"><div><button class="btn" onclick="weekOffset--;week()">← Previous</button></div><div class="weektitle">${title}</div><div class="right"><button class="btn" onclick="week()">Regenerate week</button> <button class="btn" onclick="weekOffset++;week()">Next →</button></div></div><div class="weekgrid">${days.map(x=>{let d=iso(x),isToday=d==='2026-09-30';return `<div class="day ${isToday?'today':''}"><h4>${x.toLocaleDateString('en-GB',{weekday:'short'})}</h4><div class="date">${x.getDate()} ${x.toLocaleDateString('en-GB',{month:'short'})}</div>${ev(d).map(e=>`<div class="mini ${e[3]}">${e[2]}<br><b>${e[1]}</b></div>`).join('')}${prep(d).map(p=>`<div class="mini ${p[0]}"><b>${subjects[p[0]][0]}</b><br>${p[1]}</div>`).join('')}</div>`}).join('')}</div>`}
function dl(){deadlinesView.innerHTML=`<div class="top"><div><h1>Deadlines</h1></div></div><div class="card">${deadlines.map(d=>`<div class="deadline"><b>${d[2]}</b><div><b>${d[1]}</b><div class="meta">${subjects[d[0]][0]} ${subjects[d[0]][1]}</div></div><span class="tag">${d[3].toUpperCase()}</span></div>`).join('')}</div>`}function subs(){subjectsView.innerHTML=`<div class="top"><div><h1>Subjects</h1><p>Current IB topics.</p></div></div><div class="card">${Object.entries(subjects).map(([k,s])=>`<div class="subject"><b>${s[0]} ${s[1]}</b><div>${s[2]}</div><span class="tag">IN PROGRESS</span></div>`).join('')}</div>`}function classroom(){classroomView.innerHTML=`<div class="top"><div><h1>Classroom</h1><p>School Google Classroom access is restricted.</p></div></div><div class="card"><b>Manual mode</b><p class="meta">Add assignments and deadlines directly to the planner.</p></div>`}function render(){today();week();dl();subs();classroom()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['today','week','deadlines','subjects','classroom'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view))});render();
</script></body></html>
