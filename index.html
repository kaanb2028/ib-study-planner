<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="planner" src="original.html"></iframe><script>(function(){var f=document.getElementById('planner');function keyFor(row){var b=row.querySelector('b');return b?'deadline-complete:'+b.textContent.trim():''}function decorate(){var d=f.contentDocument;if(!d)return;var rows=d.querySelectorAll('#deadlinesView .deadline');rows.forEach(function(row){var key=keyFor(row);if(!key)return;if(localStorage.getItem(key)==='1'){row.remove();return}if(row.querySelector('.deadlineCompleteBtn'))return;var btn=d.createElement('button');btn.className='btn deadlineCompleteBtn';btn.textContent='✓ Completed';btn.style.cssText='border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:700;white-space:nowrap';btn.onclick=function(){localStorage.setItem(key,'1');row.remove()};row.appendChild(btn)})}f.addEventListener('load',function(){try{var d=f.contentDocument;var style=d.createElement('style');style.textContent='.deadline{grid-template-columns:100px 1fr auto auto!important}';d.head.appendChild(style);var b=d.querySelector('.nav button[data-view="deadlines"]');if(b)b.addEventListener('click',function(){setTimeout(decorate,0)});decorate()}catch(e){}})})();</script></body></html>
