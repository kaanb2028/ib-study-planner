<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Study Planner</title><style>:root{--bg:#f6f7fb;--ink:#172033;--muted:#6c7484;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:24px 16px}.brand{font-weight:800;font-size:20px;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-size:12px;margin-top:4px}.nav button,.nav a{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover,.nav a:hover{background:#1f2937;color:#fff}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p,.meta{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.deadline{display:grid;grid-template-columns:100px minmax(250px,1fr) auto 145px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fef2f2;color:#b42318}.completeBtn{border:1px solid #86efac;background:#dcfce7;color:#166534;padding:8px 12px;border-radius:9px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.subject{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);border-left:5px solid #6b7280}.math{border-left-color:#7c3aed}.physics{border-left-color:#2878e8}.econ{border-left-color:#079669}.business{border-left-color:#d97706}.english{border-left-color:#db2777}.turkish{border-left-color:#dc2626}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px}.nav{display:flex;overflow:auto}.nav button,.nav a{width:auto;white-space:nowrap}.main{padding:14px}.deadline{grid-template-columns:1fr}.completeBtn{width:100%}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IB Study Planner<small>Kaan's personal study OS</small></div><div class="nav"><button data-view="today">Today</button><a href="calendar.html">Calendar</a><button class="active" data-view="deadlines">Deadlines</button><button data-view="subjects">Subjects</button><button data-view="classroom">Classroom</button><a href="notes.html">📚 Study Notes</a><a href="quiz.html">🧠 Take Quiz</a><a href="mistakes.html">❌ Mistake Bank</a><a href="coach.html">✨ AI Study Coach</a></div></aside><main class="main"><section id="todayView" class="hidden"></section><section id="deadlinesView"></section><section id="subjectsView" class="hidden"></section><section id="classroomView" class="hidden"></section></main></div><script>var subjects={math:'Math AA HL',physics:'Physics HL',econ:'Economics HL',business:'Business SL',english:'English SL',turkish:'Turkish SL',other:'Other'};var topics={math:'Algebra / Functions',physics:'Kinematics',econ:'Price Mechanism',business:'Vision, Mission, Strategies & Tactics',english:'Writing & Vocabulary',turkish:'Reading / Essay Writing'};var deadlines=[{id:'tur-portfolio',subject:'turkish',title:'Upload Turkish Portfolio',date:'2026-10-02',type:'homework'},{id:'math-quiz',subject:'math',title:'Math HL Quiz',date:'2026-10-05',type:'quiz'},{id:'tur-reading',subject:'turkish',title:'Read Şeyh Bedrettin Destanı',date:'2026-10-05',type:'reading'},{id:'econ-quiz',subject:'econ',title:'Economics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-quiz',subject:'physics',title:'Physics HL Quiz',date:'2026-10-06',type:'quiz'},{id:'physics-lab',subject:'physics',title:'Physics Lab Assignment',date:'2026-10-06',type:'lab'},{id:'business-quiz',subject:'business',title:'Business SL Quiz',date:'2026-10-13',type:'quiz'}];var state={};try{state=JSON.parse(localStorage.getItem('ib-planner-state')||'{}')}catch(e){}state.completedDeadlines=state.completedDeadlines||{};function save(){localStorage.setItem('ib-planner-state',JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{month:'short',day:'numeric'})}function renderDeadlines(){var active=deadlines.filter(function(d){return!state.completedDeadlines[d.id]}).sort(function(a,b){return a.date.localeCompare(b.date)});deadlinesView.innerHTML='<div class="top"><h1>Deadlines</h1><p>Real dates stay fixed. Press Completed when you finish a task.</p></div><div class="card">'+(active.length?active.map(function(d){return'<div class="deadline"><strong>'+fmt(d.date)+'</strong><div><b>'+esc(d.title)+'</b><div class="meta">'+esc(subjects[d.subject]||d.subject||'Other')+'</div></div><span class="tag">'+esc((d.type||'TASK').toUpperCase())+'</span><button class="completeBtn" data-complete="'+esc(d.id)+'">✓ Completed</button></div>'}).join(''):'<div class="empty">🎉 No active deadlines.</div>')+'</div>';document.querySelectorAll('.completeBtn').forEach(function(b){b.onclick=function(){state.completedDeadlines[b.dataset.complete]=true;save();renderDeadlines()}})}function renderSubjects(){subjectsView.innerHTML='<div class="top"><h1>Subjects</h1><p>Study priority: Math & Physics → Economics → Business → English & Turkish.</p></div><div class="grid">'+['math','physics','econ','business','english','turkish'].map(function(s){return'<div class="subject '+s+'"><b>'+subjects[s]+'</b><div class="meta">'+topics[s]+'</div></div>'}).join('')+'</div>'}function renderToday(){var today=new Date().toISOString().slice(0,10),up=deadlines.filter(function(d){return!state.completedDeadlines[d.id]&&d.date>=today}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,4);todayView.innerHTML='<div class="top"><h1>Today</h1><p>Your study dashboard.</p></div><div class="card"><b>Next deadlines</b>'+(up.length?up.map(function(d){return'<div style="padding:12px 0;border-bottom:1px solid #e7e9f0"><strong>'+fmt(d.date)+'</strong> &nbsp; '+esc(d.title)+'</div>'}).join(''):'<div class="empty">No upcoming deadlines.</div>')+'</div>'}function renderClassroom(){classroomView.innerHTML='<div class="top"><h1>Classroom</h1><p>Google Classroom assignments received by the sync appear in Deadlines automatically.</p></div><div class="card"><b>Classroom Sync</b><p class="meta">New assignments, quizzes and projects with a due date are added to the planner. Each new deadline automatically gets a Completed button.</p></div>'}async function loadClassroom(){try{var r=await fetch('classroom-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;var j=await r.json();(j.items||[]).forEach(function(x){if(x.date&&!deadlines.some(function(d){return d.id===x.id}))deadlines.push(x)});renderDeadlines();renderToday()}catch(e){}}function show(v){['today','deadlines','subjects','classroom'].forEach(function(x){document.getElementById(x+'View').classList.toggle('hidden',x!==v)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});localStorage.setItem('ib-planner-view',v)}renderDeadlines();renderSubjects();renderToday();renderClassroom();loadClassroom();document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){show(b.dataset.view)}});show(localStorage.getItem('ib-planner-view')||'deadlines');</script></body></html>
